# Include in both HTTP and HTTPS TradeOS domain SERVER contexts.
# The callback is unsigned: rate limiting protects resources, NOT authenticity.
# Transaction finality is never inferred from these requests.
location = /v1/payments/hubtel/notifications {
    # Never accept callback traffic over plaintext to the origin.
    if ($scheme != https) { return 403; }
    limit_except POST { deny all; }
    client_max_body_size 4k;
    client_body_timeout 10s;
    limit_req zone=tradeos_hubtel_callback_per_ip burst=20 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    proxy_pass http://127.0.0.1:4036;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite caller-supplied forwarding headers, don't append spoofed IPs.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
