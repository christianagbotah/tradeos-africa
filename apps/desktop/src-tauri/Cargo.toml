[package]
name = "tradeos-desktop"
version = "0.0.1"
description = "TradeOS Africa desktop client"
authors = ["Lightworld Technologies Ltd"]
edition = "2021"

[lib]
name = "tradeos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
