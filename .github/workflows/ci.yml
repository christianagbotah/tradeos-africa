name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tradeos_ci
          POSTGRES_USER: tradeos
          POSTGRES_PASSWORD: tradeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeos -d tradeos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Validate PostgreSQL migrations
        env:
          PGPASSWORD: tradeos
        run: |
          set -euo pipefail
          for migration in packages/db/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U tradeos -d tradeos_ci -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test API sync idempotency
        env:
          PGPASSWORD: tradeos
          DATABASE_URL: postgresql://tradeos:tradeos@127.0.0.1:5432/tradeos_ci
        run: |
          set -euo pipefail
          BUSINESS_ID="00000000-0000-4000-8000-000000000001"
          psql -h 127.0.0.1 -U tradeos -d tradeos_ci -v ON_ERROR_STOP=1 -c "INSERT INTO businesses (id, name, business_type) VALUES ('$BUSINESS_ID', 'CI Demo', 'RETAIL')"

          PORT=4010 pnpm --filter @tradeos/api start >/tmp/tradeos-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4010/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/tradeos-api.log
            exit 1
          fi

          BODY='{"mutations":[{"clientId":"ci-client","clientMutationId":"ci-mutation-1","businessId":"00000000-0000-4000-8000-000000000001","mutationType":"SALE_CREATE","occurredAt":"2026-10-06T00:00:00.000Z","payload":{"lines":[]}}]}'
          curl -fsS -H 'content-type: application/json' -d "$BODY" http://127.0.0.1:4010/v1/sync
          curl -fsS -H 'content-type: application/json' -d "$BODY" http://127.0.0.1:4010/v1/sync

          COUNT=$(psql -h 127.0.0.1 -U tradeos -d tradeos_ci -tAc "SELECT count(*) FROM sync_mutations WHERE business_id = '$BUSINESS_ID' AND client_id = 'ci-client' AND client_mutation_id = 'ci-mutation-1'")
          test "$COUNT" = "1"
