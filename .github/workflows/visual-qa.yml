name: Visual QA

on:
  pull_request:
    branches:
      - main
      - feat/programme-foundation-20261126
  workflow_dispatch:

# A newer PR head makes its earlier screenshot capture obsolete.
concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tradeos_qa
          POSTGRES_USER: tradeos
          POSTGRES_PASSWORD: tradeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeos -d tradeos_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # Playwright is a committed root devDependency; the lockfile is the
      # single source of truth. CI never mutates package manifests.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build contracts + client-core
        run: |
          pnpm --filter @tradeos/contracts build
          pnpm --filter @tradeos/client-core build

      - name: Apply migrations
        env:
          PGPASSWORD: tradeos
        run: |
          for migration in packages/db/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U tradeos -d tradeos_qa -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Start API server
        env:
          DATABASE_URL: postgresql://tradeos:tradeos@127.0.0.1:5432/tradeos_qa
          PORT: 4000
        run: |
          pnpm --filter @tradeos/api dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          # Wait for health
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4000/health || { echo "API failed to start"; exit 1; }

      # Fixtures are created through the PUBLIC application contracts:
      # register -> onboarding -> money accounts -> catalog (+ opening stock)
      # -> customer -> supplier. Branch creation seeds default money accounts
      # + defaults via DB trigger, so no direct SQL is required anywhere.
      - name: Seed QA data via API
        run: |
          node --input-type=module << 'SEED'
          const API = "http://127.0.0.1:4000";

          async function api(path, { method = "GET", token, body } = {}) {
            const res = await fetch(`${API}${path}`, {
              method,
              headers: {
                "content-type": "application/json",
                ...(token ? { authorization: `Bearer ${token}` } : {}),
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const json = await res.json().catch(() => ({}));
            if (!res.ok) {
              throw new Error(`Seed API failure ${method} ${path} -> ${res.status}: ${JSON.stringify(json)}`);
            }
            return json;
          }

          // 1. Register the owner through the public auth API.
          const reg = await api("/v1/auth/register", {
            method: "POST",
            body: {
              displayName: "QA Owner",
              email: "qa@tradeos.test",
              password: "TradeOS-QA-1234",
              platform: "WEB",
              deviceKey: "qa-device-key",
              appVersion: "qa-1.0",
            },
          });
          const token = reg.session.accessToken;

          // 2. Onboard through the public onboarding API. Creates business,
          //    MAIN branch, owner staff + membership, and registers the device.
          const onboard = await api("/v1/onboarding/business", {
            method: "POST",
            token,
            body: {
              name: "QA Trading Co",
              businessType: "RETAIL_HARDWARE",
              branchName: "Main",
              countryCode: "GH",
              currencyCode: "GHS",
              timezone: "Africa/Accra",
            },
          });
          const businessId = onboard.business.id;
          const branchId = onboard.branch.id;

          // 3. Named money accounts through the public treasury API.
          for (const [name, method, kind] of [
            ["MTN MoMo", "MOMO", "MOMO_WALLET"],
            ["Ecobank Account", "BANK", "BANK_ACCOUNT"],
          ]) {
            await api("/v1/money-accounts", {
              method: "POST",
              token,
              body: { businessId, branchId, name, method, kind },
            });
          }

          // 4. Catalog through the public API, opening stock included for
          //    tracked products. Club Beer is the multi-unit product:
          //    crate ₵96.00 and bottle ₵4.00 with 1 crate = 24 bottles.
          const items = [
            {
              name: "Coca-Cola 500ml", sku: "DRK-001", kind: "PRODUCT",
              stockUnitCode: "bottle", trackStock: true,
              units: [{ code: "bottle", label: "bottle", canPurchase: true, canSell: true, canStock: true, defaultSalePriceMinor: 400 }],
              openingStock: { branchId, quantity: 120 },
            },
            {
              name: "Voltic Water 1.5L", sku: "DRK-002", kind: "PRODUCT",
              stockUnitCode: "bottle", trackStock: true,
              units: [{ code: "bottle", label: "bottle", canPurchase: true, canSell: true, canStock: true, defaultSalePriceMinor: 500 }],
              openingStock: { branchId, quantity: 8 },
            },
            {
              name: "Digestive Biscuits 200g", sku: "BIS-001", kind: "PRODUCT",
              stockUnitCode: "pack", trackStock: true,
              units: [{ code: "pack", label: "pack", canPurchase: true, canSell: true, canStock: true, defaultSalePriceMinor: 650 }],
            },
            {
              name: "Standard Haircut", sku: "SVC-001", kind: "SERVICE",
              units: [{ code: "service", label: "service", canSell: true, defaultSalePriceMinor: 1500 }],
            },
            {
              name: "Rice 5kg Bag", sku: "STP-001", kind: "PRODUCT",
              stockUnitCode: "bag", trackStock: true,
              units: [{ code: "bag", label: "bag", canPurchase: true, canSell: true, canStock: true, defaultSalePriceMinor: 7200 }],
              openingStock: { branchId, quantity: 40 },
            },
            {
              name: "Club Beer", sku: "DRK-003", kind: "PRODUCT",
              stockUnitCode: "crate", trackStock: true,
              units: [
                { code: "crate", label: "crate", canPurchase: true, canSell: true, canStock: true, defaultSalePriceMinor: 9600 },
                { code: "bottle", label: "bottle", canPurchase: false, canSell: true, canStock: false, defaultSalePriceMinor: 400 },
              ],
              conversions: [{ fromUnitCode: "crate", toUnitCode: "bottle", factor: 24 }],
              openingStock: { branchId, quantity: 10 },
            },
          ];
          for (const item of items) {
            await api("/v1/catalog/items", { method: "POST", token, body: { businessId, ...item } });
          }

          // 5. Customer + supplier through public master-data APIs.
          await api("/v1/customers", {
            method: "POST",
            token,
            body: { businessId, name: "Kwame Mensah", phone: "+233500000002", email: "kwame@test.com", creditLimitMinor: 50000 },
          });
          await api("/v1/suppliers", {
            method: "POST",
            token,
            body: { businessId, name: "Accra Wholesale Ltd", phone: "+233500000003", email: "accra@wholesale.com" },
          });

          console.log("QA seed data created via public APIs");
          console.log("Login: qa@tradeos.test / TradeOS-QA-1234");
          console.log("Business:", businessId, "Branch:", branchId);
          SEED

      # Isolated fictional programme accounts. Privileged provisioning is
      # intentionally not available as a public API. This SQL runs on hosted QA only.
      - name: Seed synthetic programme organisations and invitations
        env:
          PGPASSWORD: tradeos
        run: |
          node --input-type=module << 'PROGRAMME_SEED'
          for (const width of [390,1280]) {
            for (const role of ["admin","participant","mentor","outsider"]) {
              const email="programme-"+role+"-"+width+"@tradeos.test";
              const r=await fetch("http://127.0.0.1:4000/v1/auth/register",{
                method:"POST",headers:{"content-type":"application/json"},
                body:JSON.stringify({displayName:"Fictional "+role,email,password:"Programme-QA-1234!",
                  platform:"WEB",deviceKey:"programme-qa-"+role+"-"+width,appVersion:"qa"})
              });
              if(!r.ok)throw Error("Synthetic programme registration failed");
            }
          }
          PROGRAMME_SEED
          psql -h localhost -U tradeos -d tradeos_qa -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO programme_organisations(name) VALUES ('Skills QA 390'),('Skills QA 1280');
          INSERT INTO programme_memberships(organisation_id,user_id,role)
          SELECT o.id,u.id,CASE WHEN u.email LIKE 'programme-admin-%' THEN 'ORG_ADMIN' WHEN u.email LIKE 'programme-mentor-%' THEN 'MENTOR' ELSE 'PARTICIPANT' END
          FROM programme_organisations o JOIN app_users u ON
            u.email IN ('programme-admin-'||split_part(o.name,' ',3)||'@tradeos.test',
                        'programme-participant-'||split_part(o.name,' ',3)||'@tradeos.test',
                        'programme-mentor-'||split_part(o.name,' ',3)||'@tradeos.test')
          WHERE o.name IN ('Skills QA 390','Skills QA 1280');
          SQL

      # API_BASE_URL is EXPLICIT: web installs /v1 + /api rewrites against the
      # running API. Without it, next.config.ts installs no rewrites at all —
      # production never silently assumes localhost.
      - name: Start Web dev server
        env:
          API_BASE_URL: http://127.0.0.1:4000
        run: |
          API_BASE_URL=http://127.0.0.1:4000 pnpm --filter @tradeos/web dev &
          WEB_PID=$!
          echo "WEB_PID=$WEB_PID" >> $GITHUB_ENV
          # Wait for web
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "Web is healthy"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/ || { echo "Web failed to start"; exit 1; }

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture authenticated screenshots
        run: |
          mkdir -p docs/qa/evidence/zai-ui-ux-premium
          node --input-type=module << 'CAPTURE'
          import { chromium } from "playwright";

          // Browser navigates on localhost: Next dev blocks non-localhost origins
          // from loading /_next dev resources (hydration never completes otherwise).
          // The API_BASE_URL rewrite target (127.0.0.1:4000) is server-side and unaffected.
          const WEB = "http://localhost:3000";
          const EVIDENCE = "docs/qa/evidence/zai-ui-ux-premium";
          // Visible content that indicates a broken application state.
          const FORBIDDEN = [
            "BRANCH_NOT_FOUND",
            "BUSINESS_NOT_FOUND",
            "undefined",
            "Could not load",
            "Something went wrong",
          ];
          const RAW_API_ERROR = /"error"\s*:/;

          const failures = [];
          let screenshotCount = 0;

          async function assertCleanBody(p, label) {
            // innerText = RENDERED text only. textContent would also read
            // inline script/RSC payloads and flag phantom "undefined"s that
            // no user ever sees.
            const visibleText = await p.evaluate(() => document.body.innerText);
            for (const needle of FORBIDDEN) {
              if (visibleText.includes(needle)) {
                failures.push(`${label}: forbidden content visible: "${needle}"`);
              }
            }
            if (RAW_API_ERROR.test(visibleText)) {
              failures.push(`${label}: raw API error payload visible`);
            }
          }

          const browser = await chromium.launch();

          // Actual programme-only users must not be forced into merchant onboarding.
          for(const width of [390,1280]){
            const ctx=await browser.newContext({viewport:{width,height:900}});
            const p=await ctx.newPage();
            const signIn=async(role)=>{
              await p.goto(WEB+"/programmes",{waitUntil:"domcontentloaded"});
              await p.getByLabel("Email or phone").fill("programme-"+role+"-"+width+"@tradeos.test");
              await p.getByLabel("Password",{exact:true}).fill("Programme-QA-1234!");
              await p.getByRole("button",{name:"Sign in",exact:true}).click();
            };
            const tab=async(name)=>p.getByRole("navigation",{name:"Programme sections"}).getByRole("button",{name,exact:true}).click();
            const assertFit=async()=>{
              if(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1))
                throw Error("Programme page horizontal overflow "+width);
            };
            try{
              await signIn("admin");
              await p.getByRole("heading",{name:"Skills QA "+width,exact:true}).waitFor();
              await assertFit();
              await tab("Programmes");
              await p.getByLabel("Programme name").fill("Enterprise foundations");
              await p.getByLabel("Objective").fill("Fictional practical training");
              await p.getByRole("button",{name:"Create programme",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Programme created."}).waitFor();
              await tab("Cohorts");
              await p.getByLabel("Programme",{exact:true}).selectOption({label:"Enterprise foundations"});
              await p.getByLabel("Cohort name").fill("Cohort One");
              await p.getByLabel("Capacity").fill("5");
              await p.getByRole("button",{name:"Create cohort",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Cohort created."}).waitFor();
              await assertFit();
              await p.screenshot({path:EVIDENCE+"/programme-cohorts-"+width+".png",fullPage:true});screenshotCount++;
              await p.getByRole("button",{name:"Sign out",exact:true}).click();
              await signIn("participant");
              await p.getByLabel("Display name").fill("Fictional Apprentice");
              await p.getByLabel("I am an adult.").check();
              await p.getByLabel("I agree to participate and share this profile with my programme coordinators.").check();
              await p.getByRole("button",{name:"Confirm participation",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Participation consent recorded."}).waitFor();
              await assertFit();
              await p.getByRole("button",{name:"Sign out",exact:true}).click();
              await signIn("admin");
              await p.getByRole("heading",{name:"Skills QA "+width,exact:true}).waitFor();
              await tab("Enrolments");
              await p.getByLabel("Cohort",{exact:true}).selectOption({label:"Cohort One"});
              await p.getByLabel("Beneficiary",{exact:true}).selectOption({label:"Fictional Apprentice"});
              await p.getByRole("button",{name:"Enrol participant",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Participant enrolled."}).waitFor();
              await assertFit();
              await p.screenshot({path:EVIDENCE+"/programme-enrolments-"+width+".png",fullPage:true});screenshotCount++;
              await tab("Apprenticeship");
              await p.getByLabel("Training cohort",{exact:true}).selectOption({label:"Cohort One"});
              await p.getByLabel("Pathway name",{exact:true}).fill("Tailoring fundamentals");
              await p.getByLabel("Planned hours",{exact:true}).fill("40");
              await p.getByRole("button",{name:"Create pathway",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Training pathway created."}).waitFor();
              await p.getByLabel("Training pathway",{exact:true}).selectOption({label:"Tailoring fundamentals"});
              await p.getByLabel("Apprentice",{exact:true}).selectOption({label:"Fictional Apprentice"});
              await p.getByLabel("Assigned mentor",{exact:true}).selectOption({label:"Fictional mentor"});
              await p.getByRole("button",{name:"Assign placement",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Training placement assigned."}).waitFor();
              await assertFit();
              await p.screenshot({path:EVIDENCE+"/programme-training-placement-"+width+".png",fullPage:true});screenshotCount++;
              await p.getByRole("button",{name:"Sign out",exact:true}).click();
              await signIn("mentor");
              await p.getByRole("heading",{name:"My apprentices",exact:true}).waitFor();
              await p.getByLabel("Training placement",{exact:true}).selectOption({label:"Fictional Apprentice · Tailoring fundamentals"});
              await p.getByLabel("Progress note",{exact:true}).fill("Started practical training");
              await p.getByRole("button",{name:"Save progress",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Training progress recorded."}).waitFor();
              await p.getByLabel("Training placement",{exact:true}).selectOption({label:"Fictional Apprentice · Tailoring fundamentals"});
              await p.getByLabel("Progress status",{exact:true}).selectOption("COMPLETED");
              await p.getByLabel("Progress note",{exact:true}).fill("Practical milestone completed");
              await p.getByRole("button",{name:"Save progress",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Training progress recorded."}).waitFor();
              await p.getByText("Fictional mentor · COMPLETED",{exact:true}).waitFor();
              await assertFit();
              await p.screenshot({path:EVIDENCE+"/programme-mentor-progress-"+width+".png",fullPage:true});screenshotCount++;
              await p.getByRole("button",{name:"Sign out",exact:true}).click();
              await signIn("participant");
              await p.getByText("Enterprise foundations",{exact:true}).waitFor();
              await p.getByText("Tailoring fundamentals",{exact:true}).waitFor();
              await p.getByText("Fictional mentor · 40 hours · COMPLETED",{exact:true}).waitFor();
              await assertFit();
              await p.screenshot({path:EVIDENCE+"/programme-participant-"+width+".png",fullPage:true});screenshotCount++;
              p.once("dialog",d=>d.accept());
              await p.getByRole("button",{name:"Withdraw consent",exact:true}).click();
              await p.getByRole("status").filter({hasText:"Consent withdrawn."}).waitFor();
              await p.getByText("No active enrolments.",{exact:true}).waitFor();
              await p.getByRole("button",{name:"Sign out",exact:true}).click();
              await signIn("outsider");
              await p.getByRole("heading",{name:"No programme access",exact:true}).waitFor();
              await assertFit();
              console.log("Programme-only sign-in, programme/cohort creation, participant consent, enrolment, withdrawal and outsider denial verified at "+width);
            }finally{await ctx.close();}
          }

          // First-customer launch acceptance: no API-seeded account or
          // business. Complete public registration and business setup through
          // the same UI an actual new merchant uses. Test data is isolated.
          for(const width of [390,1280]){
            const email="browser-onboard-"+width+"@tradeos.test";
            const password="TradeOS-QA-1234";
            const businessName="Browser Launch QA "+width;
            const branchName="Launch Main "+width;
            const ctx=await browser.newContext({viewport:{width,height:900}});
            const p=await ctx.newPage();
            const readScope=page=>page.evaluate(()=>{
              const raw=localStorage.getItem("tradeos.web.session.v1");
              if(!raw)return null;
              const {businessId,branchId,staffId,role,currencyCode,timezone,businessName}=JSON.parse(raw);
              return {businessId,branchId,staffId,role,currencyCode,timezone,businessName};
            });
            let original;
            try{
              await p.goto(WEB,{waitUntil:"domcontentloaded"});
              await p.getByRole("tab",{name:"Register",exact:true}).click();
              await p.locator("#pe-name").fill("Launch QA Owner "+width);
              await p.locator("#pe-id").fill(email);
              await p.locator("#pe-pw").fill(password);
              const registration=p.waitForResponse(r=>r.url().endsWith("/v1/auth/register")&&r.request().method()==="POST");
              await p.getByRole("button",{name:"Create account",exact:true}).click();
              if((await registration).status()!==201)throw new Error("Public registration failed");
              await p.getByRole("heading",{name:"Tell us about your business",exact:true}).waitFor({timeout:20000});
              const create=p.getByRole("button",{name:"Create business & open workspace",exact:true});
              if(await create.isEnabled())throw new Error("Business creation enabled without a name");
              await p.locator("#ob-name").fill(businessName);
              await p.locator("#ob-branch").fill(branchName);
              await p.locator("#ob-type").selectOption("RETAIL_HARDWARE");
              if(await p.locator("#ob-country").inputValue()!=="GH"||
                 await p.locator("#ob-currency").inputValue()!=="GHS"||
                 await p.locator("#ob-tz").inputValue()!=="Africa/Accra")
                throw new Error("Ghana onboarding defaults incorrect");
              if(await p.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2))
                throw new Error("Onboarding form has horizontal overflow");
              await p.screenshot({path:`${EVIDENCE}/public-onboarding-${width}.png`,fullPage:true});
              screenshotCount++;
              const onboard=p.waitForResponse(r=>r.url().endsWith("/v1/onboarding/business")&&r.request().method()==="POST");
              await create.click();
              const response=await onboard;
              if(response.status()!==201)throw new Error("Business onboarding failed");
              const created=await response.json();
              if(created.business?.name!==businessName||created.branch?.name!==branchName||created.owner?.role!=="OWNER")
                throw new Error("Business, branch or owner response does not match");
              await p.waitForURL("**/dashboard",{timeout:20000});
              await p.getByRole("heading",{name:"Dashboard",exact:true}).waitFor();
              original=await readScope(p);
              if(!original||original.businessId!==created.business.id||original.branchId!==created.branch.id||
                 original.staffId!==created.owner.staffId||original.role!=="OWNER"||
                 original.currencyCode!=="GHS"||original.timezone!=="Africa/Accra")
                throw new Error("Persisted workspace scope does not match onboarding");
              await assertCleanBody(p,"first-customer-dashboard-"+width);
              await p.reload({waitUntil:"domcontentloaded"});
              await p.getByRole("heading",{name:"Dashboard",exact:true}).waitFor({timeout:20000});
              if(JSON.stringify(await readScope(p))!==JSON.stringify(original))
                throw new Error("Workspace scope changed after reload");
              await p.screenshot({path:`${EVIDENCE}/first-customer-dashboard-${width}.png`,fullPage:true});
              screenshotCount++;
            }finally{await ctx.close();}
            const fresh=await browser.newContext({viewport:{width,height:900}});
            try{
              const page=await fresh.newPage();
              await page.goto(WEB,{waitUntil:"domcontentloaded"});
              await page.locator("#pe-id").fill(email);
              await page.locator("#pe-pw").fill(password);
              await page.getByRole("button",{name:"Open workspace",exact:true}).click();
              await page.waitForURL("**/dashboard",{timeout:20000});
              await page.getByRole("heading",{name:"Dashboard",exact:true}).waitFor();
              if(JSON.stringify(await readScope(page))!==JSON.stringify(original))
                throw new Error("Returning merchant did not resume the same business and branch");
              console.log("First-customer registration, onboarding, reload and fresh sign-in verified at "+width);
              // Seed only one catalog item through the new owner's authorized
              // API; the sale itself must be completed through the real UI.
              // No external gateway or customer communication is invoked.
              const itemName="Launch Test Item "+width;
              const request=async(path,body)=>{
                const result=await page.evaluate(async({path,body})=>{
                  const session=JSON.parse(localStorage.getItem("tradeos.web.session.v1"));
                  const response=await fetch(path,{method:body===null?"GET":"POST",
                    headers:{Authorization:"Bearer "+session.accessToken,"Content-Type":"application/json"},
                    ...(body===null?{}:{body:JSON.stringify(body)}),cache:"no-store"});
                  return {status:response.status,data:await response.json()};
                },{path,body});
                if(result.status<200||result.status>=300)throw new Error("First-sale API check failed: "+result.status+" "+path);
                return result.data;
              };
              const {businessId,branchId}=original;
              const created=await request("/v1/catalog/items",{businessId,name:itemName,sku:"LAUNCH-"+width,
                kind:"PRODUCT",stockUnitCode:"piece",trackStock:true,
                units:[{code:"piece",label:"piece",canPurchase:true,canSell:true,canStock:true,defaultSalePriceMinor:1000}],
                openingStock:{branchId,quantity:5}});
              const itemId=created.item?.id;
              if(!itemId)throw new Error("First-sale catalog creation did not return an item");
              const scope="?businessId="+encodeURIComponent(businessId)+"&branchId="+encodeURIComponent(branchId);
              const available=async()=>Number((await request("/v1/inventory"+scope,null)).items.find(i=>i.id===itemId)?.available);
              if(await available()!==5)throw new Error("First-sale opening stock mismatch");
              await page.goto(WEB+"/sell",{waitUntil:"domcontentloaded"});
              await page.getByRole("button",{name:"Add "+itemName+" (piece) to cart",exact:true}).click();
              const charge=width<=768?page.locator(".tos-charge-bar__charge"):page.locator("aside button:has-text('Charge')");
              await charge.click();
              const checkout=page.getByRole("dialog",{name:"Checkout",exact:true});
              await checkout.getByRole("group",{name:"Payment method",exact:true}).getByRole("button",{name:"Cash",exact:true}).click();
              await checkout.getByRole("group",{name:"Quick cash amounts",exact:true}).getByRole("button").first().click();
              const submitted=page.waitForResponse(r=>r.url().endsWith("/v1/sync")&&r.request().method()==="POST"&&
                r.request().postDataJSON()?.mutations?.some(m=>m.mutationType==="SALE_CREATE"));
              await checkout.getByRole("button",{name:/^Charge /}).click();
              const saleResponse=await submitted;
              const response=await saleResponse.json();
              const result=response.mutationResults?.[0];
              const saleId=result?.result?.saleId;
              if(!saleResponse.ok()||result?.status!=="APPLIED"||!saleId||result.result.totalMinor!==1000)
                throw new Error("First cash sale was not applied at expected total");
              await checkout.locator(".tos-success__title").filter({hasText:/^Sale complete$/}).waitFor({timeout:20000});
              if(await available()!==4)throw new Error("First sale did not reduce opening stock by exactly one");
              const sale=(await request("/v1/sales/"+encodeURIComponent(saleId)+"?businessId="+encodeURIComponent(businessId),null)).sale;
              if(sale?.status!=="COMPLETED"||sale.totalMinor!==1000||sale.lines?.length!==1||
                 Number(sale.lines[0].quantity)!==1||sale.payments?.length!==1||
                 sale.payments[0].method!=="CASH"||sale.payments[0].amountMinor!==1000||
                 sale.payments[0].status!=="SUCCEEDED")
                throw new Error("Posted sale and cash payment did not reconcile");
              await page.screenshot({path:`${EVIDENCE}/first-customer-sale-${width}.png`});
              screenshotCount++;
              await checkout.getByRole("button",{name:"Close checkout",exact:true}).click();
              await checkout.waitFor({state:"hidden"});
              if(await page.locator(".tos-cart-line").count()!==0)
                throw new Error("Closing completed checkout retained a chargeable basket");
              await page.getByRole("button",{name:"Add "+itemName+" (piece) to cart",exact:true})
                .getByText("4 left",{exact:true}).waitFor({timeout:20000});
              await page.goto(WEB+"/sales/receipt/"+encodeURIComponent(saleId),{waitUntil:"domcontentloaded"});
              const receipt=page.locator("#tos-verified-receipt");
              await receipt.waitFor({timeout:20000});
              if(!(await receipt.innerText()).includes(itemName))throw new Error("Verified receipt omitted sold item");
              await page.screenshot({path:`${EVIDENCE}/first-customer-receipt-${width}.png`,fullPage:true});
              screenshotCount++;
              console.log("First-customer cash sale, stock decrement, payment and verified receipt passed at "+width);
              // Simulate actual network loss after the catalog is loaded.
              // The queued sale must survive locally, remain unconfirmed, and
              // automatically sync on reconnect without a second stock posting.
              await page.goto(WEB+"/sell",{waitUntil:"domcontentloaded"});
              const tile=page.getByRole("button",{name:"Add "+itemName+" (piece) to cart",exact:true});
              await tile.waitFor();
              await fresh.setOffline(true);
              try {
                await tile.click();
                await (width<=768?page.locator(".tos-charge-bar__charge"):page.locator("aside button:has-text('Charge')")).click();
                const offlineCheckout=page.getByRole("dialog",{name:"Checkout",exact:true});
                await offlineCheckout.getByText("Offline — sale will queue locally",{exact:true}).waitFor();
                await offlineCheckout.getByRole("group",{name:"Payment method",exact:true}).getByRole("button",{name:"Cash",exact:true}).click();
                await offlineCheckout.getByRole("group",{name:"Quick cash amounts",exact:true}).getByRole("button").first().click();
                await offlineCheckout.getByRole("button",{name:/^Charge /}).click();
                await offlineCheckout.locator(".tos-success__title").filter({hasText:/^Sale queued$/}).waitFor();
                if(await offlineCheckout.getByRole("button",{name:"Print receipt",exact:true}).count()||
                   await offlineCheckout.getByRole("button",{name:"Share",exact:true}).count())
                  throw new Error("Offline sale offered an unconfirmed final receipt");
                const queue=await page.evaluate(id=>JSON.parse(localStorage.getItem("tradeos.web.mutationQueue.v2."+encodeURIComponent(id))),businessId);
                if(queue?.pending?.length!==1||queue.failed?.length!==0)
                  throw new Error("Offline sale was not durably queued exactly once");
                const mutation=queue.pending[0];
                if(mutation.mutationType!=="SALE_CREATE"||mutation.businessId!==businessId||
                   mutation.branchId!==branchId||mutation.payload?.lines?.[0]?.itemId!==itemId)
                  throw new Error("Offline queued sale has incorrect scope or item");
                await page.screenshot({path:`${EVIDENCE}/first-customer-offline-sale-${width}.png`});
                screenshotCount++;
                await offlineCheckout.getByRole("button",{name:"Close checkout",exact:true}).click();
                await offlineCheckout.waitFor({state:"hidden"});
                if(await page.locator(".tos-cart-line").count()!==0)
                  throw new Error("Closing queued checkout retained a chargeable basket");
                // Register response listener before reconnect; periodic flush
                // and online event may both attempt the same durable queue.
                const synced=page.waitForResponse(r=>r.url().endsWith("/v1/sync")&&r.request().method()==="POST"&&
                  r.request().postDataJSON()?.mutations?.some(m=>m.clientMutationId===mutation.clientMutationId),{timeout:45000});
                await fresh.setOffline(false);
                const syncResponse=await synced;
                const syncResult=(await syncResponse.json()).mutationResults?.find(r=>r.clientMutationId===mutation.clientMutationId);
                if(!syncResponse.ok()||syncResult?.status!=="APPLIED"||syncResult.result?.status!=="COMPLETED"||
                   syncResult.result?.totalMinor!==1000||!syncResult.result?.saleId)
                  throw new Error("Offline sale did not reconcile after reconnect");
                await page.waitForFunction(id=>{
                  const q=JSON.parse(localStorage.getItem("tradeos.web.mutationQueue.v2."+encodeURIComponent(id))||"null");
                  return q&&q.pending.length===0&&q.failed.length===0;
                },businessId,{timeout:20000});
                if(await available()!==3)throw new Error("Offline sale stock deduction was not exactly one");
                await tile.getByText("3 left",{exact:true}).waitFor({timeout:20000});
                const syncedId=syncResult.result.saleId;
                const replay=await request("/v1/sync",{mutations:[mutation]});
                const replayResult=replay.mutationResults?.find(r=>r.clientMutationId===mutation.clientMutationId);
                if(replayResult?.status!=="APPLIED"||replayResult.result?.saleId!==syncedId)
                  throw new Error("Offline replay did not retain original sale identity");
                if(await available()!==3)throw new Error("Offline replay duplicated stock deduction");
                const confirmed=(await request("/v1/sales/"+encodeURIComponent(syncedId)+"?businessId="+encodeURIComponent(businessId),null)).sale;
                if(confirmed?.status!=="COMPLETED"||confirmed.totalMinor!==1000||
                   confirmed.payments?.length!==1||confirmed.payments[0].method!=="CASH"||
                   confirmed.payments[0].amountMinor!==1000||confirmed.payments[0].status!=="SUCCEEDED")
                  throw new Error("Offline sale payment did not reconcile exactly once");
                console.log("First-customer offline cash sale, automatic reconnect and idempotent replay verified at "+width);
              }finally{await fresh.setOffline(false);}
              // Drop a genuine successful server response after posting the
              // cash mutation. Block subsequent attempts until we have
              // inspected the persisted identity and pending-only UI.
              let posted=null, allowReplay=false;
              const syncPattern="**/v1/sync";
              const intercept=async route=>{
                const req=route.request();
                const mutations=req.method()==="POST"?req.postDataJSON()?.mutations??[]:[];
                const cash=mutations.find(m=>m.mutationType==="SALE_CREATE"&&
                  m.payload?.lines?.some(l=>l.itemId===itemId));
                if(!cash){await route.continue();return;}
                if(!posted){
                  const server=await route.fetch();
                  const body=await server.json();
                  posted={mutation:cash,result:body.mutationResults?.find(r=>r.clientMutationId===cash.clientMutationId)};
                  await route.abort("failed");
                }else if(!allowReplay){await route.abort("failed");}
                else await route.continue();
              };
              await fresh.route(syncPattern,intercept);
              try{
                await tile.click();
                await (width<=768?page.locator(".tos-charge-bar__charge"):page.locator("aside button:has-text('Charge')")).click();
                const interrupted=page.getByRole("dialog",{name:"Checkout",exact:true});
                await interrupted.getByRole("group",{name:"Payment method",exact:true}).getByRole("button",{name:"Cash",exact:true}).click();
                await interrupted.getByRole("group",{name:"Quick cash amounts",exact:true}).getByRole("button").first().click();
                await interrupted.getByRole("button",{name:/^Charge /}).click();
                await interrupted.locator(".tos-success__title").filter({hasText:/^Sale queued$/}).waitFor({timeout:20000});
                if(posted?.result?.status!=="APPLIED"||posted.result.result?.status!=="COMPLETED"||
                   !posted.result.result?.saleId)
                  throw new Error("Fault injection did not capture a successfully posted cash sale");
                const originalMutation=posted.mutation;
                const originalSaleId=posted.result.result.saleId;
                const stored=await page.evaluate(id=>JSON.parse(localStorage.getItem("tradeos.web.mutationQueue.v2."+encodeURIComponent(id))),businessId);
                if(stored?.pending?.length!==1||
                   JSON.stringify(stored.pending[0])!==JSON.stringify(originalMutation))
                  throw new Error("Lost reply did not preserve exact posted cash mutation");
                if(await interrupted.getByRole("button",{name:"Print receipt",exact:true}).count())
                  throw new Error("Unconfirmed response offered a receipt");
                if(await available()!==2)throw new Error("Lost-response sale did not post exactly once");
                await interrupted.getByRole("button",{name:"Close checkout",exact:true}).click();
                if(await page.locator(".tos-cart-line").count()!==0)
                  throw new Error("Interrupted cash checkout retained submitted basket");
                const recovered=page.waitForResponse(r=>r.url().endsWith("/v1/sync")&&r.request().method()==="POST"&&
                  r.request().postDataJSON()?.mutations?.some(m=>m.clientMutationId===originalMutation.clientMutationId),{timeout:45000});
                allowReplay=true;
                const response=await recovered;
                const replayed=(await response.json()).mutationResults?.find(r=>r.clientMutationId===originalMutation.clientMutationId);
                if(replayed?.status!=="APPLIED"||replayed.result?.saleId!==originalSaleId)
                  throw new Error("Lost-response retry did not recover original sale");
                await page.waitForFunction(id=>{
                  const q=JSON.parse(localStorage.getItem("tradeos.web.mutationQueue.v2."+encodeURIComponent(id))||"null");
                  return q&&q.pending.length===0&&q.failed.length===0;
                },businessId,{timeout:20000});
                if(await available()!==2)throw new Error("Lost-response retry duplicated inventory posting");
                const recoveredSale=(await request("/v1/sales/"+encodeURIComponent(originalSaleId)+"?businessId="+encodeURIComponent(businessId),null)).sale;
                if(recoveredSale?.status!=="COMPLETED"||recoveredSale.totalMinor!==1000||
                   recoveredSale.payments?.length!==1||recoveredSale.payments[0].amountMinor!==1000||
                   recoveredSale.payments[0].method!=="CASH"||recoveredSale.payments[0].status!=="SUCCEEDED")
                  throw new Error("Recovered cash payment did not reconcile");
                console.log("Actual server-posted cash sale with lost reply recovered exactly once at "+width);
              }finally{await fresh.unroute(syncPattern,intercept);}
              // Use the original online sale for a full, restockable cash
              // return. The offline and recovered sales remain completed and separate.
              await page.goto(WEB+"/returns",{waitUntil:"domcontentloaded"});
              const shortReceipt=saleId.slice(0,8);
              const trigger=width<=768?
                page.getByRole("button",{name:"Return goods from receipt "+shortReceipt,exact:true}):
                page.locator("tr").filter({hasText:"#"+shortReceipt}).getByRole("button",{name:"Return",exact:true});
              await trigger.click();
              const correction=page.getByRole("dialog",{name:"Process return",exact:true});
              await correction.getByRole("button",{name:"Increase return quantity for "+itemName,exact:true}).click();
              await correction.getByRole("radio",{name:/Restockable/}).click();
              await correction.locator("#rr-refund-method").selectOption("ORIGINAL_METHOD");
              await correction.locator("#rr-reason").selectOption("Customer changed mind");
              await page.screenshot({path:`${EVIDENCE}/first-customer-return-${width}.png`});
              screenshotCount++;
              const submittedReturn=page.waitForResponse(r=>r.url().endsWith("/v1/sync")&&r.request().method()==="POST"&&
                r.request().postDataJSON()?.mutations?.some(m=>m.mutationType==="RETURN_CREATE"&&m.payload?.originalSaleId===saleId),{timeout:45000});
              await correction.getByRole("button",{name:"Post return (1 line)",exact:true}).click();
              const returnResponse=await submittedReturn;
              const returnMutation=returnResponse.request().postDataJSON().mutations.find(m=>m.mutationType==="RETURN_CREATE"&&m.payload.originalSaleId===saleId);
              const reversal=(await returnResponse.json()).mutationResults?.find(r=>r.clientMutationId===returnMutation.clientMutationId);
              if(!returnResponse.ok()||reversal?.status!=="APPLIED"||!reversal.result?.returnCaseId||
                 reversal.result.refundTotalMinor!==1000||reversal.result.pendingRefundMinor!==0)
                throw new Error("Cash return was not posted and settled");
              await correction.waitFor({state:"hidden",timeout:20000});
              if(await available()!==3)throw new Error("Returned item was not restocked exactly once");
              const refundedSale=(await request("/v1/sales/"+encodeURIComponent(saleId)+"?businessId="+encodeURIComponent(businessId),null)).sale;
              if(refundedSale?.status!=="REFUNDED"||refundedSale.payments?.length!==1||
                 refundedSale.payments[0].method!=="CASH"||refundedSale.payments[0].status!=="REVERSED"||
                 refundedSale.payments[0].refundedMinor!==1000||Number(refundedSale.lines[0].quantityReturnable)!==0)
                throw new Error("Returned sale or original cash payment did not reverse");
              const returnReplay=await request("/v1/sync",{mutations:[returnMutation]});
              const replayedReturn=returnReplay.mutationResults?.find(r=>r.clientMutationId===returnMutation.clientMutationId);
              if(replayedReturn?.status!=="APPLIED"||replayedReturn.result?.returnCaseId!==reversal.result.returnCaseId||
                 await available()!==3)
                throw new Error("Return replay duplicated stock or changed the original return identity");
              const unchanged=(await request("/v1/sales/"+encodeURIComponent(saleId)+"?businessId="+encodeURIComponent(businessId),null)).sale;
              if(unchanged.payments?.length!==1||unchanged.payments[0].refundedMinor!==1000)
                throw new Error("Return replay duplicated cash reversal");
              await page.goto(WEB+"/sales/receipt/"+encodeURIComponent(saleId),{waitUntil:"domcontentloaded"});
              await page.locator("#tos-verified-receipt").waitFor({timeout:20000});
              await page.screenshot({path:`${EVIDENCE}/first-customer-refunded-receipt-${width}.png`,fullPage:true});
              screenshotCount++;
              console.log("First-customer full cash return, restock, payment reversal and idempotent replay verified at "+width);
            }finally{await fresh.close();}
          }

          // === STEP 1: Authenticate through the real login flow ===
          const loginContext = await browser.newContext({ viewport: { width: 1280, height: 900 } });
          const loginPage = await loginContext.newPage();
          await loginPage.goto(`${WEB}/`, { waitUntil: "networkidle", timeout: 30000 });
          await loginPage.waitForTimeout(2000);

          const inputs = await loginPage.locator(".tos-input").all();
          if (inputs.length >= 2) {
            await inputs[0].fill("qa@tradeos.test");
            await inputs[1].fill("TradeOS-QA-1234");
          } else {
            await loginPage.fill("input", "qa@tradeos.test");
          }
          await loginPage.fill('input[type="password"]', "TradeOS-QA-1234");
          await loginPage.click('button[type="submit"]');

          // The dashboard redirect is REQUIRED — never swallow this wait.
          await loginPage.waitForURL("**/dashboard", { timeout: 20000 });
          await loginPage.waitForTimeout(3000);
          if (!loginPage.url().includes("/dashboard")) {
            console.error("Authentication failed — still on:", loginPage.url());
            process.exit(1);
          }
          console.log("Authenticated successfully — on /dashboard");

          // Regression guard: Web access tokens expire after 15 minutes while
          // refresh tokens remain valid. Corrupt only the access token and
          // require the next authenticated route to recover transparently.
          let refreshResponses = 0;
          loginPage.on("response", (response) => {
            if (response.url().includes("/v1/auth/refresh") && response.status() === 200) {
              refreshResponses += 1;
            }
          });
          const sessionBeforeRefresh = await loginPage.evaluate(() => {
            const raw = localStorage.getItem("tradeos.web.session.v1");
            return raw ? JSON.parse(raw) : null;
          });
          if (!sessionBeforeRefresh?.refreshToken) {
            failures.push("session-refresh: authenticated Web session must persist a refresh token");
          } else {
            await loginPage.evaluate(() => {
              const key = "tradeos.web.session.v1";
              const raw = localStorage.getItem(key);
              if (!raw) return;
              const session = JSON.parse(raw);
              session.accessToken = "tos_access_intentionally_invalid_visual_qa";
              localStorage.setItem(key, JSON.stringify(session));
            });
            await loginPage.goto(`${WEB}/purchases`, { waitUntil: "networkidle", timeout: 30000 });
            await loginPage.waitForTimeout(1500);
            const sessionAfterRefresh = await loginPage.evaluate(() => {
              const raw = localStorage.getItem("tradeos.web.session.v1");
              return raw ? JSON.parse(raw) : null;
            });
            if (refreshResponses < 1) {
              failures.push("session-refresh: expired access token did not call /v1/auth/refresh");
            }
            if (!sessionAfterRefresh || sessionAfterRefresh.accessToken === "tos_access_intentionally_invalid_visual_qa") {
              failures.push("session-refresh: access token was not rotated after ACCESS_REJECTED");
            }
            if (sessionAfterRefresh?.refreshToken === sessionBeforeRefresh.refreshToken) {
              failures.push("session-refresh: refresh-token rotation was not persisted");
            }
            const recoveredText = await loginPage.evaluate(() => document.body.innerText);
            if (recoveredText.includes("ACCESS_REJECTED") || recoveredText.includes("Access token is expired or revoked")) {
              failures.push("session-refresh: raw token-expiry error became visible after recovery");
            }
            await assertCleanBody(loginPage, "session-refresh");
            console.log("Session refresh regression guard completed");
          }

          // Real browser regression: the confirmed response must update the
          // document list even while the subsequent server GET is held back.
          await loginPage.goto(`${WEB}/documents`, {waitUntil:"domcontentloaded"});
          await loginPage.getByRole("heading",{name:"Quotations & proforma invoices"}).waitFor();
          await loginPage.getByText("No documents here yet. Create your first quotation.").waitFor({timeout:30000});
          let nativeDialogs=0;
          loginPage.on("dialog",async dialog=>{nativeDialogs++;await dialog.dismiss();});
          const dismissFeedback=async()=>{
            const close=loginPage.getByRole("button",{name:"Dismiss notification"});
            await close.first().waitFor({state:"visible",timeout:10000});
            await close.first().click();
          };
          // Keep one route installed for the whole exercise. Removing an
          // intercepted route while its async handler is still resuming can
          // cause Playwright to handle the same request twice.
          const documentListMatcher=/\/v1\/commercial-documents\?[^#]*$/;
          let listHold=null;
          await loginPage.route(documentListMatcher,async route=>{
            const hold=listHold;
            if(hold&&route.request().method()==="GET"){
              hold.intercepted();
              await hold.gate;
            }
            await route.continue();
          });
          const delayedWrite=async(trigger,assertVisible)=>{
            let release,intercepted;
            const gate=new Promise(resolve=>{release=resolve;});
            const firstHeldRead=new Promise(resolve=>{intercepted=resolve;});
            listHold={gate,intercepted};
            const refreshed=loginPage.waitForResponse(response=>
              documentListMatcher.test(response.url())&&response.request().method()==="GET"&&response.ok(),
              {timeout:30000});
            // Prevent a timeout from becoming an unhandled rejection if a
            // preceding UI assertion fails. It is still awaited on success.
            refreshed.catch(()=>{});
            try{
              await trigger();
              await Promise.all([
                assertVisible(),
                Promise.race([firstHeldRead,new Promise((_,reject)=>setTimeout(()=>reject(new Error("Mutation did not trigger a document list reload")),15000))]),
              ]);
            }finally{
              listHold=null;
              release();
            }
            await refreshed;
            await dismissFeedback();
          };
          // Verify actual PDF bytes in the browser. The OS share interface is
          // stubbed only at its boundary; no real customer message is sent.
          async function verifyCommercialPdf(kind,href,issued){
            const width=kind==="PROFORMA"?390:1280;
            const p=await loginContext.newPage();
            try{
              await p.setViewportSize({width,height:850});
              await p.addInitScript(()=>{
                Object.defineProperty(navigator,"canShare",{configurable:true,value:data=>data.files?.length===1});
                Object.defineProperty(navigator,"share",{configurable:true,value:async data=>{
                  const file=data.files?.[0];
                  window.__pdfShareEvidence={count:data.files?.length,name:file?.name,type:file?.type,
                    signature:file?await file.slice(0,5).text():null,hasText:Boolean(data.text),size:file?.size};
                }});
              });
              await p.goto(WEB+href,{waitUntil:"domcontentloaded"});
              await p.locator("#tradeos-commercial-document").waitFor({timeout:30000});
              const prepare=p.getByRole("button",{name:"Prepare PDF",exact:true});
              if(!issued){
                if(await prepare.count()||await p.getByRole("button",{name:"Share PDF",exact:true}).count())
                  throw new Error("Non-issued document exposes customer sharing");
                return;
              }
              await prepare.waitFor({timeout:15000});
              const paper=p.getByLabel("PDF paper",{exact:true});
              for(const size of ["A5","80mm","58mm"]){
                await paper.selectOption(size);
                await prepare.click();
                const downloadButton=p.getByRole("button",{name:"Download PDF",exact:true});
                await downloadButton.waitFor({timeout:15000});
                const [download]=await Promise.all([p.waitForEvent("download"),downloadButton.click()]);
                const {readFile}=await import("node:fs/promises");
                const bytes=await readFile(await download.path());
                if(bytes.length<100||bytes.subarray(0,5).toString()!=="%PDF-"||
                   !download.suggestedFilename().endsWith("-"+size+".pdf"))
                  throw new Error("Invalid downloaded "+kind+" "+size+" PDF");
                await prepare.waitFor();
              }
              await paper.selectOption("A5");
              await prepare.click();
              await p.getByRole("button",{name:"Share PDF",exact:true}).click();
              await p.getByText("PDF handed to your chosen app. Delivery is not confirmed.",{exact:true}).waitFor();
              const shared=await p.evaluate(()=>window.__pdfShareEvidence);
              if(shared?.count!==1||shared?.signature!=="%PDF-"||shared?.type!=="application/pdf"||
                 shared?.hasText||!shared.name.endsWith("-A5.pdf")||shared.size<100)
                throw new Error("OS share did not receive actual PDF: "+JSON.stringify(shared));
              await p.screenshot({path:`${EVIDENCE}/commercial-pdf-${kind.toLowerCase()}-${width}.png`,fullPage:true});
              screenshotCount++;
              console.log("Real PDF download and file-only share verified for "+kind+" at "+width);
            }finally{await p.close();}
          }

          for(const kind of ["PROFORMA","QUOTATION"]){
            const name="Browser QA "+kind;
            await loginPage.getByLabel("Document type").selectOption(kind);
            await loginPage.getByLabel("Customer name").fill(name);
            await loginPage.getByLabel("Item 1",{exact:true}).selectOption({label:"Standard Haircut"});
            await loginPage.getByLabel("Quantity 1",{exact:true}).fill("2");
            const row=loginPage.locator("article").filter({hasText:name});
            await delayedWrite(
              ()=>loginPage.getByRole("button",{name:"Create draft",exact:true}).click(),
              ()=>row.getByText("DRAFT",{exact:true}).waitFor({timeout:15000})
            );
            const documentHref=await row.getByRole("link",{name:"View",exact:true}).getAttribute("href");
            if(!documentHref?.startsWith("/documents/"))throw new Error("Document detail link missing");
            await verifyCommercialPdf(kind,documentHref,false);
            await row.getByRole("button",{name:"Edit",exact:true}).click();
            await loginPage.getByRole("button",{name:"Save changes",exact:true}).waitFor();
            const updatedName=name+" revised";
            await loginPage.getByLabel("Customer name").fill(updatedName);
            await loginPage.getByLabel("Quantity 1",{exact:true}).fill("3");
            const revised=loginPage.locator("article").filter({hasText:updatedName});
            await delayedWrite(
              ()=>loginPage.getByRole("button",{name:"Save changes",exact:true}).click(),
              ()=>revised.getByText("DRAFT",{exact:true}).waitFor({timeout:15000})
            );
            await delayedWrite(
              ()=>revised.getByRole("button",{name:"Issue",exact:true}).click(),
              ()=>revised.getByText("ISSUED",{exact:true}).waitFor({timeout:15000})
            );
            await verifyCommercialPdf(kind,documentHref,true);
            if(await revised.getByRole("button",{name:"Edit",exact:true}).count())
              throw new Error("Issued document unexpectedly offers editing");
            await revised.getByRole("button",{name:"Cancel",exact:true}).click();
            const confirmation=loginPage.locator("dialog.tos-custom-dialog[open]");
            await confirmation.waitFor({timeout:10000});
            await confirmation.getByRole("button",{name:"Keep document",exact:true}).click();
            await revised.getByText("ISSUED",{exact:true}).waitFor();
            await revised.getByRole("button",{name:"Cancel",exact:true}).click();
            await confirmation.waitFor();
            await delayedWrite(
              ()=>confirmation.getByRole("button",{name:"Cancel document",exact:true}).click(),
              ()=>revised.getByText("CANCELLED",{exact:true}).waitFor({timeout:15000})
            );
            await verifyCommercialPdf(kind,documentHref,false);
          }
          await loginPage.unrouteAll({behavior:"wait"});
          if(nativeDialogs)throw new Error("Unexpected native browser dialog in commercial document workflow");
          console.log("Browser document create, edit, issue, cancel and immediate refresh checks passed");

          const state = await loginContext.storageState();
          await loginContext.close();

          // Merchant UAT regression: exercise client-side navigation (no reload)
          // and the actual scroll lock, including stock-adjustment open/close.
          for (const width of [390, 1280]) {
            const ctx = await browser.newContext({ storageState: state, viewport: { width, height: 600 } });
            const p = await ctx.newPage();
            try {
              await p.goto(`${WEB}/dashboard`, { waitUntil:"domcontentloaded" });
              await p.getByRole("heading", {name:"Dashboard", exact:true}).waitFor({timeout:30000});
              await p.evaluate(() => { window.__tradeosNavigationQA = "same-document"; });
              const navigate = async (path, heading) => {
                if(width===390) {
                  await p.getByRole("button", {name:"More navigation"}).click();
                  await p.locator(`.tos-more-tile[href="${path}"]`).click();
                } else {
                  await p.locator(`.tos-sidebar__link[href="${path}"]`).click();
                }
                await p.waitForURL(`**${path}`);
                await p.getByRole("heading", {name:heading, exact:true}).waitFor({timeout:30000});
                await p.waitForFunction(() => document.body.style.overflow !== "hidden", {timeout:10000});
                if(await p.evaluate(() => window.__tradeosNavigationQA) !== "same-document")
                  throw new Error("Navigation unexpectedly reloaded document");
              };
              const checkScroll = async () => {
                await p.waitForFunction(() => {
                  const el=document.scrollingElement;
                  return el && el.scrollHeight > el.clientHeight + 30;
                }, null, {timeout:15000});
                await p.evaluate(() => window.scrollTo(0,0));
                await p.waitForFunction(() => window.scrollY === 0);
                await p.mouse.move(width-36, 350);
                await p.mouse.wheel(0, 500);
                await p.waitForFunction(() => window.scrollY > 20, null, {timeout:8000});
              };
              await navigate("/inventory","Inventory");
              await checkScroll();
              const adjust=width===390
                ? p.getByRole("button",{name:/Adjust stock for Coca-Cola/})
                : p.getByRole("button",{name:"Adjust",exact:true}).first();
              await adjust.click();
              const sheet=p.getByRole("dialog",{name:"Inventory adjustment"});
              await sheet.waitFor();
              await p.waitForFunction(() => document.body.style.overflow === "hidden");
              await sheet.getByRole("button",{name:"Close",exact:true}).click();
              await sheet.waitFor({state:"hidden"});
              await p.waitForFunction(() => document.body.style.overflow !== "hidden");
              await checkScroll();
              await navigate("/purchase-orders","Purchase orders");
              await navigate("/inventory","Inventory");
              await checkScroll();
              await p.screenshot({path:`${EVIDENCE}/inventory-navigation-${width}.png`});
              screenshotCount++;
              console.log("Inventory client navigation and adjustment scroll regression passed at "+width);
            } catch(err) { failures.push("inventory-navigation-"+width+": "+err.message); }
            finally { await ctx.close(); }
          }

          // Purchase-order layout and product uniqueness: no orders posted.
          for(const width of [390,1024,1280,1440]) {
            const ctx=await browser.newContext({storageState:state,viewport:{width,height:850}});
            const p=await ctx.newPage();
            try {
              await p.goto(`${WEB}/purchase-orders`, {waitUntil:"domcontentloaded"});
              const form=p.getByRole("region",{name:"Create purchase order",exact:true});
              await form.waitFor({timeout:30000});
              const add=form.getByRole("button",{name:"+ Add item",exact:true});
              const first=form.getByLabel("Line 1 item",{exact:true});
              await first.locator("option").filter({hasText:"Coca-Cola 500ml"}).waitFor({state:"attached",timeout:30000});
              if(!await add.isDisabled())throw new Error("Add item enabled before selecting product");
              await first.selectOption({label:"Coca-Cola 500ml"});
              await add.click();
              const second=form.getByLabel("Line 2 item",{exact:true});
              await second.waitFor();
              if(!await add.isDisabled())throw new Error("Add item enabled with an empty row");
              if(await second.locator("option").filter({hasText:"Coca-Cola 500ml"}).count())
                throw new Error("Previously selected product is still selectable");
              await second.selectOption({label:"Voltic Water 1.5L"});
              if(await first.locator("option").filter({hasText:"Voltic Water 1.5L"}).count())
                throw new Error("Later selected product is still selectable in first row");
              const dimensions=await form.evaluate(el=>{
                const supplier=el.querySelector("select");
                const date=el.querySelector('input[type="date"]');
                const region=el.querySelector('[aria-label^="Purchase order items"]');
                const add=[...el.querySelectorAll("button")].find(b=>b.textContent.trim()==="+ Add item");
                const create=[...el.querySelectorAll("button")].find(b=>b.textContent.trim()==="Create draft order");
                return {sameRow:Math.abs(supplier.getBoundingClientRect().top-date.getBoundingClientRect().top)<2,
                  rowOverflow:region.scrollWidth-region.clientWidth,
                  addWidth:add.offsetWidth,createWidth:create.offsetWidth,formWidth:el.clientWidth,
                  pageOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
              });
              if(width>=1024 && (!dimensions.sameRow || dimensions.rowOverflow>2))
                throw new Error("Desktop field alignment or item grid overflow: "+JSON.stringify(dimensions));
              if(dimensions.pageOverflow>2 || dimensions.addWidth>=dimensions.formWidth*.7 || dimensions.createWidth>=dimensions.formWidth*.7)
                throw new Error("Page overflow or full-width action: "+JSON.stringify(dimensions));
              await p.screenshot({path:`${EVIDENCE}/purchase-order-create-${width}.png`,fullPage:true});
              screenshotCount++;
              await form.getByRole("button",{name:"Remove line 2"}).click();
              if(!await first.locator("option").filter({hasText:"Voltic Water 1.5L"}).count())
                throw new Error("Removed product did not become selectable again");
              console.log("Purchase-order layout and uniqueness passed at "+width);
            } catch(err){failures.push("purchase-order-create-"+width+": "+err.message);}
            finally {await ctx.close();}
          }

          // === STEP 2: Routes + markers ===
          const routes = [
            { path: "/dashboard", marker: "Dashboard", name: "dashboard" },
            { path: "/sell", marker: "Sell", name: "pos" },
            { path: "/sales", marker: "Sales", name: "sales" },
            { path: "/customers", marker: "Customer", name: "customers" },
            { path: "/catalog", marker: "Catalog", name: "catalog" },
            { path: "/inventory", marker: "Inventory", name: "inventory" },
            { path: "/purchases", marker: "Purchase", name: "purchases" },
            { path: "/documents", marker: "Quotations & proforma invoices", name: "documents" },
            { path: "/returns", marker: "Return", name: "returns" },
            { path: "/cashbook", marker: "Cashbook", name: "cashbook" },
            { path: "/operations", marker: "Operation", name: "operations" },
            { path: "/reports", marker: "Report", name: "reports" },
            { path: "/settings", marker: "Settings", name: "settings" },
            { path: "/settings?section=team", marker: "Team & access", name: "settings-team" },
          ];

          const widthSets = {
            dashboard: [360, 390, 768, 1280, 1440],
            pos: [360, 390, 768, 1280, 1440],
            sales: [390, 768, 1280],
            customers: [390, 768, 1280],
            catalog: [390, 768, 1280],
            inventory: [390, 768, 1280],
            purchases: [390, 768, 1280],
            documents: [390, 768, 1280],
            returns: [390, 768, 1280],
            cashbook: [390, 768, 1280],
            operations: [390, 768, 1280],
            reports: [390, 768, 1280],
            settings: [390, 768, 1280],
            "settings-team": [390, 768, 1280],
          };

          // === STEP 3: Capture every authenticated route at every width ===
          for (const route of routes) {
            const widths = widthSets[route.name] || [390, 768, 1280];
            for (const w of widths) {
              const pageCtx = await browser.newContext({ storageState: state, viewport: { width: w, height: 900 } });
              const p = await pageCtx.newPage();
              try {
                // The returns page loads two independent authenticated datasets.
                // A route-level networkidle wait can time out even when the page
                // has hydrated successfully. Assert UI readiness instead so that
                // a genuine stuck loading state still fails visual QA.
                await p.goto(`${WEB}${route.path}`, {
                  waitUntil: route.name === "returns" ? "domcontentloaded" : "networkidle",
                  timeout: 30000,
                });
                if (route.name === "returns") {
                  await p.getByRole("heading", { name: "Returns, refunds & exchanges" })
                    .waitFor({ state: "visible", timeout: 30000 });
                  await p.locator('[aria-label="Refund settlement worklist"]')
                    .waitFor({ state: "visible", timeout: 30000 });
                  await p.locator('.tos-page .tos-state[role="status"]')
                    .waitFor({ state: "hidden", timeout: 30000 });
                }
                await p.waitForTimeout(2000);

                const finalUrl = p.url();
                if (!finalUrl.includes(route.path)) {
                  failures.push(`${route.name}-${w}: redirected to ${finalUrl}`);
                } else {
                  const bodyText = await p.textContent("body");
                  if (!bodyText || !bodyText.includes(route.marker)) {
                    failures.push(`${route.name}-${w}: marker "${route.marker}" not found`);
                  }
                  await assertCleanBody(p, `${route.name}-${w}`);
                  if (route.name === "returns") {
                    const visible = await p.evaluate(() => document.body.innerText);
                    if (/\bNaN\b/.test(visible)) {
                      failures.push(`${route.name}-${w}: invalid monetary NaN visible`);
                    }
                  }
                  if (w <= 768) {
                    const scrollWidth = await p.evaluate(() => document.documentElement.scrollWidth);
                    const clientWidth = await p.evaluate(() => document.documentElement.clientWidth);
                    if (scrollWidth > clientWidth) {
                      failures.push(`${route.name}-${w}: horizontal overflow (${scrollWidth} > ${clientWidth})`);
                    }
                  }
                }

                await p.screenshot({ path: `${EVIDENCE}/${route.name}-${w}.png`, fullPage: true });
                screenshotCount++;
                console.log(`Captured ${route.name}-${w}.png`);
              } catch (err) {
                failures.push(`${route.name}-${w}: ${err.message}`);
              }
              await pageCtx.close();
            }
          }

          // === STEP 4: Settings business/branch editor states ===
          async function settingsEditorFlow(path, selector, clickName, shot) {
            for (const width of [390, 768, 1280]) {
              const ctx = await browser.newContext({ storageState: state, viewport: { width, height: 900 } });
              const p = await ctx.newPage();
              try {
                const branchPolicyView = path.includes("section=branches");
                let policyReads = 0;
                if (branchPolicyView) {
                  p.on("request", request => {
                    if (request.url().includes("/v1/operations/sale-shift-policy")) policyReads++;
                  });
                }
                await p.goto(`${WEB}${path}`, {
                  waitUntil: branchPolicyView ? "domcontentloaded" : "networkidle",
                  timeout: 30000,
                });
                if (branchPolicyView) {
                  await p.locator('[aria-label="Shift before sale policy"]')
                    .waitFor({ state: "visible", timeout: 30000 });
                  await p.getByText("Current setting:", { exact: false })
                    .waitFor({ state: "visible", timeout: 30000 });
                }
                await p.waitForTimeout(1200);
                if (branchPolicyView && policyReads > 3) {
                  failures.push(shot+"-"+width+": repeated shift policy GET requests ("+policyReads+")");
                }
                if (clickName) {
                  await p.getByRole("button", { name: clickName, exact: true }).first().click();
                }
                await p.locator(selector).first().waitFor({ state: "visible", timeout: 10000 });
                await assertCleanBody(p, `${shot}-${width}`);
                if (width <= 768) {
                  const scrollWidth = await p.evaluate(() => document.documentElement.scrollWidth);
                  const clientWidth = await p.evaluate(() => document.documentElement.clientWidth);
                  if (scrollWidth > clientWidth) {
                    failures.push(`${shot}-${width}: horizontal overflow (${scrollWidth} > ${clientWidth})`);
                  }
                }
                await p.screenshot({ path: `${EVIDENCE}/${shot}-${width}.png`, fullPage: true });
                screenshotCount++;
                console.log(`Captured ${shot}-${width}.png`);
              } catch (err) {
                failures.push(`${shot}-${width}: ${err.message}`);
              }
              await ctx.close();
            }
          }

          await settingsEditorFlow("/settings?section=business&action=create", "#settings-new-business-name", null, "settings-business-create");
          await settingsEditorFlow("/settings?section=business", "#settings-business-name", "Edit business", "settings-business-edit");
          await settingsEditorFlow("/settings?section=branches&action=create", "#new-branch-name", null, "settings-branch-create");
          await settingsEditorFlow("/settings?section=branches", ".tos-settings__branch-editor-shell", "Edit", "settings-branch-edit");

          // Prove add/edit modes are mutually exclusive at runtime, not only in static contracts.
          {
            const ctx = await browser.newContext({ storageState: state, viewport: { width: 390, height: 900 } });
            const p = await ctx.newPage();
            try {
              await p.goto(`${WEB}/settings?section=business`, { waitUntil: "networkidle", timeout: 30000 });
              await p.getByRole("button", { name: "Edit business", exact: true }).click();
              await p.locator("#settings-business-name").waitFor({ state: "visible" });
              await p.getByRole("button", { name: "Add business", exact: true }).click();
              await p.locator("#settings-new-business-name").waitFor({ state: "visible" });
              if (await p.locator("#settings-business-name").count()) failures.push("settings-business-modes: edit remained open after Add business");
              await p.getByRole("button", { name: "Edit business", exact: true }).click();
              await p.locator("#settings-business-name").waitFor({ state: "visible" });
              if (await p.locator("#settings-new-business-name").count()) failures.push("settings-business-modes: create remained open after Edit business");

              await p.goto(`${WEB}/settings?section=branches`, {
                waitUntil: "domcontentloaded", timeout: 30000,
              });
              await p.locator('[aria-label="Shift before sale policy"]')
                .waitFor({ state: "visible", timeout: 30000 });
              await p.getByText("Current setting:", { exact: false })
                .waitFor({ state: "visible", timeout: 30000 });
              await p.getByRole("button", { name: "Edit", exact: true }).first().click();
              await p.locator(".tos-settings__branch-editor-shell").waitFor({ state: "visible" });
              await p.getByRole("button", { name: "Add branch", exact: true }).click();
              await p.locator("#new-branch-name").waitFor({ state: "visible" });
              if (await p.locator(".tos-settings__branch-editor-shell").count()) failures.push("settings-branch-modes: edit remained open after Add branch");
              await p.getByRole("button", { name: "Edit", exact: true }).first().click();
              await p.locator(".tos-settings__branch-editor-shell").waitFor({ state: "visible" });
              if (await p.locator("#new-branch-name").count()) failures.push("settings-branch-modes: create remained open after Edit");
            } catch (err) {
              failures.push(`settings-mode-exclusivity: ${err.message}`);
            }
            await ctx.close();
          }

          // === STEP 5: Public team-invite safe fallback ===
          async function inviteMissingFlow(width, shot) {
            const ctx = await browser.newContext({ viewport: { width, height: 900 } });
            const p = await ctx.newPage();
            try {
              await p.goto(`${WEB}/invite/team`, { waitUntil: "networkidle", timeout: 30000 });
              await p.waitForTimeout(800);
              const expected = "This invitation link is no longer available in this tab";
              const visibleText = await p.evaluate(() => document.body.innerText);
              if (!visibleText.includes(expected)) {
                failures.push(`${shot}: secure missing-invitation state was not rendered`);
              }
              await assertCleanBody(p, shot);
              const scrollWidth = await p.evaluate(() => document.documentElement.scrollWidth);
              const clientWidth = await p.evaluate(() => document.documentElement.clientWidth);
              if (scrollWidth > clientWidth) {
                failures.push(`${shot}: horizontal overflow (${scrollWidth} > ${clientWidth})`);
              }
              await p.screenshot({ path: `${EVIDENCE}/${shot}.png`, fullPage: true });
              screenshotCount++;
              console.log(`Captured ${shot}.png`);
            } catch (err) {
              failures.push(`${shot}: ${err.message}`);
            }
            await ctx.close();
          }

          await inviteMissingFlow(390, "team-invite-missing-390");
          await inviteMissingFlow(1280, "team-invite-missing-1280");

          // === STEP 6: Catalog unit editor responsive layout ===
          async function catalogFormFlow(width, label, shot) {
            const ctx = await browser.newContext({ storageState: state, viewport: { width, height: 900 } });
            const p = await ctx.newPage();
            try {
              await p.goto(`${WEB}/catalog`, { waitUntil: "networkidle", timeout: 30000 });
              await p.waitForTimeout(1500);
              await p.getByRole("button", { name: "Add item" }).first().click();
              const sheet = p.locator('div[role="dialog"][aria-label="Add catalog item"]');
              await sheet.waitFor({ state: "visible", timeout: 10000 });

              const fields = sheet.locator(".tos-catalog-unit-grid > .tos-field");
              if ((await fields.count()) !== 3) {
                failures.push(`${label}: expected Unit code, Label and Sale price as 3 related fields`);
              } else {
                const boxes = await Promise.all([0, 1, 2].map((i) => fields.nth(i).boundingBox()));
                if (boxes.some((box) => !box)) {
                  failures.push(`${label}: catalog unit fields must all be visible`);
                } else if (width > 768) {
                  const ys = boxes.map((box) => box.y);
                  if (Math.max(...ys) - Math.min(...ys) > 6) {
                    failures.push(`${label}: Unit code, Label and Sale price must share one desktop row`);
                  }
                } else {
                  if (!(boxes[0].y < boxes[1].y && boxes[1].y < boxes[2].y)) {
                    failures.push(`${label}: catalog unit fields must stack vertically on mobile`);
                  }
                }
              }

              const emptyHint = sheet.locator(".tos-catalog-empty-hint");
              const addConversion = sheet.getByRole("button", { name: "Add conversion" });
              const hintBox = await emptyHint.boundingBox();
              const addBox = await addConversion.boundingBox();
              if (!hintBox || !addBox || addBox.y - (hintBox.y + hintBox.height) < 8) {
                failures.push(`${label}: conversion empty-state needs visible spacing before Add conversion`);
              }

              const scrollWidth = await p.evaluate(() => document.documentElement.scrollWidth);
              const clientWidth = await p.evaluate(() => document.documentElement.clientWidth);
              if (scrollWidth > clientWidth) {
                failures.push(`${label}: horizontal overflow (${scrollWidth} > ${clientWidth})`);
              }
              await p.screenshot({ path: `${EVIDENCE}/${shot}.png`, fullPage: true });
              screenshotCount++;
              console.log(`Captured ${shot}.png`);
            } catch (err) {
              failures.push(`${label}: ${err.message}`);
            }
            await ctx.close();
          }

          await catalogFormFlow(1280, "catalog-form-1280", "catalog-form-open-1280");
          await catalogFormFlow(390, "catalog-form-390", "catalog-form-open-390");

          // === STEP 6: POS multi-unit flow — every step REQUIRED ===
          async function posFlow(width, label, cartShot, checkoutShot) {
            const posCtx = await browser.newContext({ storageState: state, viewport: { width, height: 900 } });
            const p = await posCtx.newPage();
            try {
              await p.goto(`${WEB}/sell`, { waitUntil: "networkidle", timeout: 30000 });
              await p.waitForTimeout(2000);

              // Both Club Beer sale units MUST render as separate enabled tiles.
              const crateTile = p.locator('button.tos-product-tile:not([disabled])[aria-label="Add Club Beer (crate) to cart"]');
              const bottleTile = p.locator('button.tos-product-tile:not([disabled])[aria-label="Add Club Beer (bottle) to cart"]');
              if ((await crateTile.count()) !== 1) failures.push(`${label}: exactly one enabled Club Beer (crate) tile is required`);
              if ((await bottleTile.count()) !== 1) failures.push(`${label}: exactly one enabled Club Beer (bottle) tile is required`);

              await crateTile.click();
              await p.waitForTimeout(400);
              await bottleTile.click();
              await p.waitForTimeout(400);

              // Cart MUST contain both selections as distinct unit-aware lines.
              if ((await p.locator(".tos-cart-line", { hasText: "crate" }).count()) < 1) {
                failures.push(`${label}: cart must contain the crate selection`);
              }
              if ((await p.locator(".tos-cart-line", { hasText: "bottle" }).count()) < 1) {
                failures.push(`${label}: cart must contain the bottle selection`);
              }
              if ((await p.locator(".tos-cart-line").count()) < 2) {
                failures.push(`${label}: crate and bottle must be distinct cart lines`);
              }

              // The cart starts directly under its header and the charge
              // stays visible while cashier scrolls the item list.
              if(width<=768){
                await p.getByRole("button",{name:/View cart, 2 items/}).click();
                await p.locator('.tos-pos__cart-wrap[data-open="true"]').waitFor();
                await p.waitForTimeout(400);
              }
              const cart=p.getByRole("complementary",{name:"Cart",exact:true});
              const cartLayout=await cart.evaluate(el=>{
                const head=el.querySelector(".tos-pos__cart-head").getBoundingClientRect();
                const first=el.querySelector(".tos-cart-line").getBoundingClientRect();
                const body=el.querySelector(".tos-pos__cart-body");
                const foot=el.querySelector(".tos-pos__cart-foot").getBoundingClientRect();
                const qty=el.querySelector(".tos-cart-line__qty-btn").getBoundingClientRect();
                return {gap:first.top-head.bottom,footBottom:foot.bottom,viewport:window.innerHeight,
                  bodyHeight:body.clientHeight,qtyWidth:qty.width,qtyHeight:qty.height};
              });
              if(cartLayout.gap>24||cartLayout.gap<0||cartLayout.footBottom>cartLayout.viewport+2||
                 cartLayout.qtyWidth<44||cartLayout.qtyHeight<44)
                throw new Error("Cart header gap, charge visibility or touch target: "+JSON.stringify(cartLayout));
              if(width>768){
                // Shrink the viewport without navigation or losing the cart.
                await p.setViewportSize({width,height:720});
                await p.waitForTimeout(150);
                const compact=await cart.evaluate(el=>{
                  const footer=el.querySelector(".tos-pos__cart-foot").getBoundingClientRect();
                  return {bottom:footer.bottom,viewport:window.innerHeight,bodyHeight:el.querySelector(".tos-pos__cart-body").clientHeight};
                });
                if(compact.bottom>compact.viewport+2||compact.bodyHeight<40)
                  throw new Error("Desktop short-screen charge not visible: "+JSON.stringify(compact));
                await p.setViewportSize({width,height:900});
              }
              if(width<=768){
                await p.screenshot({path:`${EVIDENCE}/pos-cart-open-${width}.png`});
                screenshotCount++;
                await p.locator('.tos-pos__cart-scrim[data-open="true"]').click({position:{x:10,y:10}});
                await p.locator('.tos-pos__cart-wrap[data-open="false"]').waitFor();
                await p.waitForTimeout(400);
              }

              // Charge MUST exist, be enabled, and open checkout when clicked.
              const charge = width <= 768
                ? p.locator(".tos-charge-bar__charge")
                : p.locator("aside button:has-text('Charge')");
              if ((await charge.count()) !== 1) failures.push(`${label}: exactly one Charge button is required`);
              if ((await charge.count()) === 1 && !(await charge.isEnabled())) {
                failures.push(`${label}: Charge must be enabled with a populated cart`);
              }

              await p.screenshot({ path: `${EVIDENCE}/${cartShot}.png`, fullPage: true });
              screenshotCount++;
              console.log(`Captured ${cartShot}.png`);

              await charge.click();
              await p.waitForTimeout(800);
              if ((await p.locator('div[role="dialog"][aria-label="Checkout"]').count()) < 1) {
                failures.push(`${label}: checkout must open when Charge is clicked`);
              }

              // Cart item details MUST be itemized, visible, and rendered BEFORE
              // the payment section. Regression guard: sheet bodies are column
              // flex; without flex-shrink:0 the Order summary section (overflow
              // hidden) silently collapses to ~0px when content overflows.
              const checkoutLines = p.locator('div[role="dialog"][aria-label="Checkout"] .tos-checkout-lines__row');
              if ((await checkoutLines.count()) < 2) {
                failures.push(`${label}: checkout must itemize at least 2 cart lines before payment`);
              }
              const linesBox = await p.locator('div[role="dialog"][aria-label="Checkout"] .tos-checkout-lines').first().boundingBox();
              if (!linesBox || linesBox.height < 48) {
                failures.push(`${label}: checkout cart item details are collapsed or invisible (height ${linesBox ? Math.round(linesBox.height) : "none"})`);
              }
              const firstLineTop = linesBox ? linesBox.y : null;
              const payField = p.locator('div[role="dialog"][aria-label="Checkout"] .tos-field', { hasText: "Payment method" }).first();
              const payBox = await payField.boundingBox();
              if (firstLineTop !== null && payBox && !(firstLineTop < payBox.y)) {
                failures.push(`${label}: cart item details must render before the payment section`);
              }

              const checkout=p.getByRole("dialog",{name:"Checkout",exact:true});
              const tenders=checkout.getByRole("group",{name:"Payment method",exact:true});
              const labels=await tenders.getByRole("button").allTextContents();
              if(JSON.stringify(labels.map(x=>x.trim()))!==JSON.stringify(["Cash","Electronic","Pay later"]))
                throw new Error("Unexpected primary tender labels: "+JSON.stringify(labels));
              const rects=await tenders.getByRole("button").evaluateAll(buttons=>buttons.map(b=>{
                const r=b.getBoundingClientRect();return {top:r.top,right:r.right,left:r.left,width:r.width,height:r.height};
              }));
              if(rects.some(r=>Math.abs(r.top-rects[0].top)>2||r.width<44||r.height<44)||
                 rects[2].right>width+2||rects[0].left<0)
                throw new Error("Primary tenders must fit one row: "+JSON.stringify(rects));
              const approval=checkout.getByRole("link",{name:"Request a new discount or view approval status"});
              await approval.waitFor();
              if(await approval.getAttribute("href")!=="/pricing")throw new Error("Missing pricing approval destination");
              await tenders.getByRole("button",{name:"Cash",exact:true}).click();
              await checkout.getByLabel("Cash received").waitFor();
              await tenders.getByRole("button",{name:"Electronic",exact:true}).click();
              const electronic=checkout.getByRole("group",{name:"Electronic payment type",exact:true});
              await electronic.getByRole("button",{name:/Mobile money/}).waitFor();
              await electronic.getByRole("button",{name:/Bank card/}).click();
              if(await electronic.getByRole("button",{name:/Bank card/}).getAttribute("aria-pressed")!=="true")
                throw new Error("Card tender did not select");
              await tenders.getByRole("button",{name:"Pay later",exact:true}).click();
              await checkout.getByText(/Pay later requires an active selected customer/).waitFor();
              if(await tenders.getByRole("button",{name:"Pay later",exact:true}).getAttribute("aria-pressed")!=="true")
                throw new Error("Pay later tender did not select");
              await tenders.getByRole("button",{name:"Cash",exact:true}).click();
              await checkout.getByLabel("Cash received").waitFor();
              console.log("Compact cart and three-tender checkout verified at "+width);
              await p.screenshot({ path: `${EVIDENCE}/${checkoutShot}.png`, fullPage: true });
              screenshotCount++;
              console.log(`Captured ${checkoutShot}.png`);
              await checkout.getByRole("button",{name:"Close checkout"}).click();
              await checkout.waitFor({state:"hidden"});
              if(await p.locator(".tos-cart-line").count()!==2)
                throw new Error("Closing checkout lost cart lines");
            } catch (err) {
              failures.push(`${label}: ${err.message}`);
            }
            await posCtx.close();
          }

          await posFlow(1280, "pos-multiunit-1280", "pos-multiunit-1280", "pos-checkout-1280");
          await posFlow(390, "pos-multiunit-390", "pos-multiunit-390", "pos-checkout-390");

          // === STEP 7: Purchase receipt sheet OPEN (desktop + narrow mobile) ===
          async function receiptFlow(width, label, shot) {
            const ctx = await browser.newContext({ storageState: state, viewport: { width, height: 900 } });
            const p = await ctx.newPage();
            try {
              await p.goto(`${WEB}/purchases`, { waitUntil: "networkidle", timeout: 30000 });
              await p.waitForTimeout(2000);
              const trigger = p.locator("button:has-text('Record receipt')").first();
              if ((await trigger.count()) < 1) {
                failures.push(`${label}: Record receipt trigger not found`);
              } else {
                await trigger.click();
                await p.waitForTimeout(600);
                const sheet = p.locator('div[role="dialog"][aria-label="Record purchase receipt"]');
                if ((await sheet.count()) < 1) {
                  failures.push(`${label}: purchase receipt sheet did not open`);
                } else {
                  if ((await p.locator(".tos-receipt-line").count()) < 1) {
                    failures.push(`${label}: compact receipt line row missing`);
                  }
                  await assertCleanBody(p, label);
                }
              }
              await p.screenshot({ path: `${EVIDENCE}/${shot}.png`, fullPage: true });
              screenshotCount++;
              console.log(`Captured ${shot}.png`);
            } catch (err) {
              failures.push(`${label}: ${err.message}`);
            }
            await ctx.close();
          }

          await receiptFlow(1280, "purchases-receipt-1280", "purchase-receipt-open-1280");
          await receiptFlow(390, "purchases-receipt-390", "purchase-receipt-open-390");

          // === Report failures ===
          if (failures.length > 0) {
            console.error("\n=== VISUAL QA FAILURES ===");
            for (const f of failures) {
              console.error(`  FAIL: ${f}`);
            }
            console.error(`\nTotal failures: ${failures.length}`);
            console.error(`Total screenshots: ${screenshotCount}`);
            process.exit(1);
          }

          console.log(`\nAll ${screenshotCount} screenshots captured successfully. No failures.`);
          await browser.close();
          CAPTURE

      # Create actual sales, quotation and PO documents through the isolated
      # API contracts, then verify Chromium renders print CSS and real PDFs.
      # This catches blank previews that ordinary screenshots of /sales miss.
      - name: Verify nonblank printable sales receipts and documents
        run: node scripts/qa/verify-print-pages.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: docs/qa/evidence/zai-ui-ux-premium/
          retention-days: 30
