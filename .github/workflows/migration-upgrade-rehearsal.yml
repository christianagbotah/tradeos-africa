name: Rehearse upgrade from deployed schema 0060
on:
  pull_request:
    paths:
      - 'packages/db/migrations/**'
      - 'apps/api/src/migrations/**'
      - 'scripts/qa/upgrade-0060-to-0064.sh'
      - '.github/workflows/migration-upgrade-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: tradeos
          POSTGRES_PASSWORD: tradeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeos -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: pnpm --filter @tradeos/api... install --frozen-lockfile
      - name: Restore and upgrade synthetic baseline
        run: bash scripts/qa/upgrade-0060-to-0064.sh
