name: TradeOS Source-Light Runtime Artifact Pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Rebuild exact runtime on changes to the relevant service inputs.
      # The old filters missed normal Quick Serve and outbox commits.
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/system-admin/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'apps/web/next.config.ts'
      - 'apps/system-admin/next.config.ts'
      - 'ops/release/**'
      - 'test/ci-artifact-pilot-contract.test.mjs'
      - 'test/root-candidate-auditor.test.mjs'
      - 'test/root-candidate-auditor-upgrade.test.mjs'
      - 'test/test_ci_artifact_intake.py'
      - 'test/test_ci_signed_provenance.py'
      - 'test/test_ci_candidate_seal.py'
      - 'test/test_source_light_launchers.py'
      - 'test/read-only-promotion-gate.test.mjs'
      - 'test/read-only-finance-gate.test.mjs'
      - 'test/signed-release-readiness.test.mjs'
      - 'test/controlled-cutover.test.mjs'
      - 'test/release-retention-plan.test.mjs'
      - 'test/root-signed-coordinator-upgrade.test.mjs'
      - 'test/verify-runtime-tree.test.mjs'
      - 'test/test_root_backup_evidence.py'
      - 'test/test_signed_runtime_release.py'
      - 'test/tradeos-staging-backup-restore.test.mjs'
      - 'test/tradeos-staging-backup-timer.test.mjs'
      - 'ops/release/runtime/**'
      - '.github/workflows/runtime-artifact-pilot.yml'
  push:
    branches: [main]
    paths:
      # Rebuild exact runtime on changes to the relevant service inputs.
      # The old filters missed normal Quick Serve and outbox commits.
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/system-admin/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'apps/web/next.config.ts'
      - 'apps/system-admin/next.config.ts'
      - 'ops/release/**'
      - 'test/ci-artifact-pilot-contract.test.mjs'
      - 'test/root-candidate-auditor.test.mjs'
      - 'test/root-candidate-auditor-upgrade.test.mjs'
      - 'test/test_ci_artifact_intake.py'
      - 'test/test_ci_signed_provenance.py'
      - 'test/test_ci_candidate_seal.py'
      - 'test/test_source_light_launchers.py'
      - 'test/read-only-promotion-gate.test.mjs'
      - 'test/read-only-finance-gate.test.mjs'
      - 'test/signed-release-readiness.test.mjs'
      - 'test/controlled-cutover.test.mjs'
      - 'test/release-retention-plan.test.mjs'
      - 'test/root-signed-coordinator-upgrade.test.mjs'
      - 'test/verify-runtime-tree.test.mjs'
      - 'test/test_root_backup_evidence.py'
      - 'test/test_signed_runtime_release.py'
      - 'test/tradeos-staging-backup-restore.test.mjs'
      - 'test/tradeos-staging-backup-timer.test.mjs'
      - 'ops/release/runtime/**'
      - '.github/workflows/runtime-artifact-pilot.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: tradeos-runtime-artifact-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pilot:
    name: GitHub build, checksum and standalone smoke (not deployment)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tradeos_ci
          POSTGRES_USER: tradeos
          POSTGRES_PASSWORD: tradeos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tradeos -d tradeos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check exact-main install source identity without installing anything
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ops/release/install-root-candidate-auditor.sh \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA" --check

      - name: Enable locked pnpm
        run: corepack enable

      - name: Verify source-only and immutable deployment boundaries
        run: node --test test/ci-artifact-pilot-contract.test.mjs

      - name: Verify root-owned installed auditor rejects unsafe operations
        run: node --test test/root-candidate-auditor.test.mjs test/root-candidate-auditor-upgrade.test.mjs

      - name: Verify read-only intake rejects unsafe archives
        run: python3 -m unittest discover -s test -p test_ci_artifact_intake.py -v

      - name: Verify standalone launchers with isolated fake runtimes
        run: python3 -m unittest discover -s test -p test_source_light_launchers.py -v

      - name: Verify signature acceptance rejects untrusted provenance
        run: python3 -m unittest discover -s test -p test_ci_signed_provenance.py -v

      - name: Verify promotion migration ledger is read-only and fail-closed
        run: node --test test/read-only-promotion-gate.test.mjs

      - name: Verify read-only finance/refund and offline-queue preflight contracts
        run: node --test test/read-only-finance-gate.test.mjs

      - name: Verify signed release format and preflight
        run: |
          node --test test/signed-release-readiness.test.mjs
          node --test test/controlled-cutover.test.mjs test/release-retention-plan.test.mjs test/root-signed-coordinator-upgrade.test.mjs test/verify-runtime-tree.test.mjs
          node --check ops/release/activate-signed-runtime.mjs
          bash -n ops/release/signed-release-activate.sh
          bash -n ops/release/install-root-signed-activate.sh
          bash -n ops/release/upgrade-root-signed-activate.sh
          bash -n ops/release/root-signed-activate-entrypoint.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s test -p test_root_backup_evidence.py -v
          bash -n ops/release/signed-release-intake.sh
          bash -n ops/release/install-root-signed-intake.sh
          bash -n ops/release/root-signed-intake-entrypoint.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s test -p test_signed_runtime_release.py -v

      - name: Verify TradeOS isolated PostgreSQL backup and restore fail-closed contracts
        run: node --test test/tradeos-staging-backup-restore.test.mjs

      - name: Verify root-owned TradeOS daily backup scheduler safety contracts
        run: node --test test/tradeos-staging-backup-timer.test.mjs

      - name: Verify temporary candidate sealing rejects unsafe filesystem entries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s test -p test_ci_candidate_seal.py -v

      - name: Install dependencies on GitHub runner only
        run: pnpm install --frozen-lockfile

      - name: Build API and traced Next runtimes on GitHub runner only
        env:
          TRADEOS_CI_ARTIFACT: '1'
          TRADEOS_RELEASE_SHA: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          pnpm --filter @tradeos/contracts build
          pnpm --filter @tradeos/domain build
          pnpm --filter @tradeos/client-core build
          pnpm --filter @tradeos/api build
          pnpm --filter @tradeos/web build
          pnpm --filter @tradeos/system-admin build

      - name: Assemble source-light pilot, verify checksum and source identity
        env:
          TRADEOS_CI_ARTIFACT: '1'
          TRADEOS_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash ops/release/create-ci-artifact-pilot.sh "$GITHUB_SHA" \
            "$RUNNER_TEMP/tradeos-release-artifact"

      - name: Inspect source-light pilot archive without extracting or activating
        run: |
          set -euo pipefail
          python3 ops/release/inspect-ci-artifact-pilot.py "$GITHUB_SHA" \
            "$RUNNER_TEMP/tradeos-release-artifact"

      - name: Smoke test archive after clean extraction on GitHub runner
        env:
          DATABASE_URL: postgresql://tradeos:tradeos@127.0.0.1:5432/tradeos_ci
          TRADEOS_HUBTEL_POS_ENABLED: 'false'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tradeos-release-artifact/tradeos-runtime-pilot-$GITHUB_SHA.tar.gz"
          cd "$RUNNER_TEMP/tradeos-release-artifact"
          sha256sum --check "$(basename "$archive").sha256"
          # The same non-following, bounded extractor used by VPS rehearsal.
          # The archive must pass the complete read-only intake before any
          # output directory can be created.
          root="$RUNNER_TEMP/tradeos-rehearsal-extracted"
          python3 "$GITHUB_WORKSPACE/ops/release/rehearse-ci-artifact-pilot.py" "$GITHUB_SHA" \
            "$RUNNER_TEMP/tradeos-release-artifact" "$root"
          # Exercise exactly the same release-local launcher contract that
          # will be used under the existing three PM2 process names.
          : > "$RUNNER_TEMP/tradeos-source-light-smoke.env"
          node - "$root/manifest.json" "$GITHUB_SHA" <<'NODE'
          const fs=require('node:fs');
          const manifest=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(manifest.sourceCommit!==process.argv[3] || manifest.deployable!==false ||
             manifest.type!=='TRADEOS_CI_RUNTIME_ARTIFACT_PILOT') process.exit(1);
          NODE
          (TRADEOS_ENV_FILE="$RUNNER_TEMP/tradeos-source-light-smoke.env" \
             WEB_PORT=13036 WEB_HOST=127.0.0.1 \
             bash "$root/bin/start-web.sh" > "$RUNNER_TEMP/tradeos-web.log" 2>&1) &
          web_pid=$!
          (TRADEOS_ENV_FILE="$RUNNER_TEMP/tradeos-source-light-smoke.env" \
             ADMIN_PORT=13038 ADMIN_HOST=127.0.0.1 \
             bash "$root/bin/start-system-admin.sh" > "$RUNNER_TEMP/tradeos-admin.log" 2>&1) &
          admin_pid=$!
          (TRADEOS_ENV_FILE="$RUNNER_TEMP/tradeos-source-light-smoke.env" \
             PORT=14036 HOST=127.0.0.1 TRADEOS_HUBTEL_POS_ENABLED=false \
             bash "$root/bin/start-api.sh" > "$RUNNER_TEMP/tradeos-api.log" 2>&1) &
          api_pid=$!
          trap 'kill "$web_pid" "$admin_pid" "$api_pid" 2>/dev/null || true' EXIT
          for service in 'web:13036:/' 'admin:13038:/' 'api:14036:/health'; do
            IFS=: read -r name port route <<< "$service"
            ready=0
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
                "http://127.0.0.1:$port$route" || true)
              if [[ "$status" =~ ^[23][0-9]{2}$ ]]; then ready=1; break; fi
              sleep 1
            done
            if [[ "$ready" != 1 ]]; then
              cat "$RUNNER_TEMP/tradeos-$name.log"
              echo "Failed standalone smoke: $name" >&2
              exit 1
            fi
            echo "CI artifact service $name: HTTP $status"
          done
          for route in /v1/refunds/settlement-queue /v1/refunds/settlement-evidence-export; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:14036$route")
            test "$status" = 401
          done
          echo 'CI artifact smoke passed; no VPS deployment or live payment state changed.'

      # Sign the exact archive bytes *after* independent checksum, sandbox
      # extraction, API/web/admin startup and finance authorization smoke.
      # PRs and manual dispatches are NEVER eligible for VPS intake.
      - name: Sign provenance of tested archive (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/tradeos-release-artifact/tradeos-runtime-pilot-${{ github.sha }}.tar.gz

      - name: Publish short-lived, non-deployable pilot archive
        uses: actions/upload-artifact@v4
        with:
          name: tradeos-runtime-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/tradeos-release-artifact/*
          if-no-files-found: error
          retention-days: 3
