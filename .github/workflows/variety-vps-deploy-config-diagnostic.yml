name: Variety VPS Deploy Config Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    if: >-
      github.event.issue.number == 67 &&
      github.actor == 'christianagbotah' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/variety-vps deploy-config-scan'
    runs-on: [self-hosted, linux, x64, lightworld-vps, staging, tradeos-staging]
    timeout-minutes: 5
    env:
      GH_ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_API_URL: ${{ github.api_url }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Read deploy config contract
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/variety-deploy-config-output.txt"
          {
            printf '== common engine ==\n'
            sed -n '1,520p' /usr/local/libexec/lightworld-deploy/common.sh 2>/dev/null || true
            printf '\n== tradeos config example ==\n'
            sed -n '1,260p' /etc/lightworld-deploy/apps.d/tradeos-africa.staging.conf 2>/dev/null || true
            printf '\n== sudoers deploy policy ==\n'
            grep -RinE 'lightworld-(deploy|status|rollback)-tradeos|lwrun_tradeos' /etc/sudoers /etc/sudoers.d 2>/dev/null | head -n 100 || true
          } > "$output_file" 2>&1
          python3 - "$output_file" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); t=p.read_text(encoding='utf-8',errors='replace')
          t=re.sub(r'(?i)(token|password|secret|api[_-]?key)=\S+',r'\1=[REDACTED]',t)
          t=t.replace('```',"'''")
          if len(t)>20000:t=t[:20000]+'\n[output truncated]\n'
          p.write_text(t,encoding='utf-8')
          PY
      - name: Post result
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{const output=fs.readFileSync(`${process.env.RUNNER_TEMP}/variety-deploy-config-output.txt`,'utf8').trimEnd();const body=['<!-- variety-vps-deploy-config-diagnostic -->','**Variety VPS deploy-config diagnostic**','','```text',output,'```'].join('\n');const r=await fetch(`${process.env.GH_API_URL}/repos/${process.env.GH_REPOSITORY}/issues/${process.env.GH_ISSUE_NUMBER}/comments`,{method:'POST',headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({body})});if(!r.ok)throw new Error(`GitHub comment API returned ${r.status}`)})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
