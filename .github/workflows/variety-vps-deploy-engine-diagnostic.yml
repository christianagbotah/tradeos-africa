name: Variety VPS Deploy Engine Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: variety-vps-deploy-engine-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.issue.number == 67 &&
      github.actor == 'christianagbotah' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/variety-vps deploy-engine-scan'
    runs-on: [self-hosted, linux, x64, lightworld-vps, staging, tradeos-staging]
    timeout-minutes: 5
    env:
      GH_ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_API_URL: ${{ github.api_url }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Inspect generic Lightworld deploy engine
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/variety-deploy-engine-output.txt"
          {
            printf 'runner_user='; whoami
            printf 'host='; hostname

            printf '\n== deploy engine files ==\n'
            find /usr/local/libexec/lightworld-deploy -maxdepth 2 -type f -printf '%u:%g %m %p\n' 2>/dev/null | sort || true

            printf '\n== deploy engine scripts ==\n'
            for file in \
              /usr/local/libexec/lightworld-deploy/lightworld-deploy \
              /usr/local/libexec/lightworld-deploy/lightworld-status \
              /usr/local/libexec/lightworld-deploy/lightworld-rollback; do
              if [ -r "$file" ]; then
                printf '%s\n' "--- $file ---"
                sed -n '1,360p' "$file" 2>/dev/null || true
              fi
            done

            printf '\n== deploy config candidates ==\n'
            for root in /etc/lightworld-deploy /etc/lightworld /usr/local/etc/lightworld-deploy /var/lib/lightworld-deploy; do
              if [ -e "$root" ]; then
                printf '%s\n' "--- $root ---"
                find "$root" -maxdepth 3 -type f -printf '%u:%g %m %p\n' 2>/dev/null | sort | head -n 200 || true
              fi
            done

            printf '\n== variety references in deploy engine/config ==\n'
            grep -RinE 'variety|vgrocer|portal.*3037|3037' \
              /usr/local/libexec/lightworld-deploy /etc/lightworld-deploy /etc/lightworld /usr/local/etc/lightworld-deploy /var/lib/lightworld-deploy \
              2>/dev/null | head -n 200 || true

            printf '\n== deploy systemd/sudo references ==\n'
            grep -RinE 'lightworld-deploy|lwrun_tradeos|tradeos-staging|variety' \
              /etc/sudoers /etc/sudoers.d /etc/systemd/system \
              2>/dev/null | head -n 240 || true
          } > "$output_file" 2>&1

          python3 - "$output_file" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          text = re.sub(r'(?i)(token|password|secret|api[_-]?key)=\S+', r'\1=[REDACTED]', text)
          text = text.replace('```', "'''")
          if len(text) > 20000:
              text = text[:20000] + '\n[output truncated]\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Post sanitized result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            const output = fs.readFileSync(`${process.env.RUNNER_TEMP}/variety-deploy-engine-output.txt`, 'utf8').trimEnd();
            const body = ['<!-- variety-vps-deploy-engine-diagnostic -->','**Variety VPS deploy-engine diagnostic**','','```text',output || '(no output)','```'].join('\n');
            const url = `${process.env.GH_API_URL}/repos/${process.env.GH_REPOSITORY}/issues/${process.env.GH_ISSUE_NUMBER}/comments`;
            const response = await fetch(url, { method:'POST', headers:{ Accept:'application/vnd.github+json', Authorization:`Bearer ${process.env.GITHUB_TOKEN}`, 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28' }, body:JSON.stringify({body}) });
            if (!response.ok) throw new Error(`GitHub comment API returned ${response.status}`);
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
