name: Build TradeOS Android preview

on:
  push:
    branches: [main, feat/native-safe-area-parity-20261124, feat/native-customers-parity-20261124, feat/native-catalog-stock-20261124, feat/native-advanced-trade-20261124, feat/native-suppliers-purchases-20261124, feat/native-purchase-orders-20261124, feat/native-finance-20261124, feat/native-returns-exchanges-20261124, feat/native-treasury-consolidated-20261124, feat/native-operations-20261124]
    paths:
      - 'apps/mobile/**'
      - 'packages/client-core/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_TRADEOS_API_BASE: https://tradeosafrica.lightworldtech.com
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked mobile dependencies
        run: pnpm --filter @tradeos/mobile... install --frozen-lockfile
      - name: Build shared packages
        run: |
          pnpm --filter @tradeos/contracts build
          pnpm --filter @tradeos/client-core build
      - name: Verify mobile code
        run: |
          pnpm --filter @tradeos/mobile typecheck
          pnpm --filter @tradeos/mobile test
      - name: Generate standalone Android preview project
        working-directory: apps/mobile
        run: |
          node -e 'const fs=require("fs"); const p="app.json"; const c=JSON.parse(fs.readFileSync(p)); c.expo.name="TradeOS Africa Preview"; c.expo.android.package="com.lightworldtech.tradeos.preview"; fs.writeFileSync(p, JSON.stringify(c,null,2));'
          pnpm exec expo prebuild --platform android --no-install --clean
      - name: Build bundled APK with preview signing
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package and checksum
        run: |
          mkdir -p preview
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk preview/TradeOS-Africa-Preview.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$signer"
          "$signer" verify --print-certs preview/TradeOS-Africa-Preview.apk
          (cd preview && sha256sum TradeOS-Africa-Preview.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: TradeOS-Africa-Android-Preview
          path: preview/
          if-no-files-found: error
          retention-days: 14
  publish-preview:
    needs: android
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/native-safe-area-parity-20261124' || github.ref == 'refs/heads/feat/native-customers-parity-20261124' || github.ref == 'refs/heads/feat/native-catalog-stock-20261124' || github.ref == 'refs/heads/feat/native-advanced-trade-20261124' || github.ref == 'refs/heads/feat/native-suppliers-purchases-20261124' || github.ref == 'refs/heads/feat/native-purchase-orders-20261124' || github.ref == 'refs/heads/feat/native-finance-20261124' || github.ref == 'refs/heads/feat/native-returns-exchanges-20261124' || github.ref == 'refs/heads/feat/native-treasury-consolidated-20261124' || github.ref == 'refs/heads/feat/native-operations-20261124')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TradeOS-Africa-Android-Preview
          path: preview
      - name: Publish verified preview as an explicitly marked prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tag="android-preview-${SHA:0:12}"
          gh release create "$tag" --repo "$REPO" --target "$SHA" --prerelease --title "TradeOS Android testing preview ${SHA:0:12}" --notes "Android testing only. Separate preview package; not a production-signed release. Use a test business; device-level UAT is pending. Future preview installs may need uninstall/reinstall if signing keys differ." preview/TradeOS-Africa-Preview.apk preview/SHA256SUMS.txt
