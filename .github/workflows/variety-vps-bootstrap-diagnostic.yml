name: Variety VPS Bootstrap Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: variety-vps-bootstrap-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.issue.number == 67 &&
      github.actor == 'christianagbotah' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/variety-vps bootstrap-scan'
    runs-on: [self-hosted, linux, x64, lightworld-vps, staging, tradeos-staging]
    timeout-minutes: 5
    env:
      GH_ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_API_URL: ${{ github.api_url }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Inspect existing privileged deployment infrastructure
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/variety-bootstrap-output.txt"
          {
            printf 'runner_user='; whoami
            printf 'host='; hostname

            printf '\n== current variety portal ==\n'
            systemctl show varietygroceries-portal.service -p ActiveState -p SubState -p MainPID -p WorkingDirectory -p ExecStart --no-pager 2>/dev/null || true
            printf 'portal_current='; readlink -f /home/lightworld/webapps/varietygroceries-portal-current 2>/dev/null || true

            printf '\n== tradeos helper implementation pattern ==\n'
            for helper in \
              /usr/local/sbin/lightworld-status-tradeos-staging \
              /usr/local/sbin/lightworld-deploy-tradeos-staging \
              /usr/local/sbin/lightworld-rollback-tradeos-staging; do
              if [ -r "$helper" ]; then
                printf '%s\n' "--- $helper ---"
                sed -n '1,220p' "$helper" 2>/dev/null || true
              fi
            done

            printf '\n== deployment/pickup directories ==\n'
            for path in \
              /home/lightworld/deployments \
              /home/lightworld/deploy \
              /var/lib/lightworld-deploy \
              /var/lib/lightworld \
              /opt/lightworld \
              /srv/lightworld; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                stat -c 'type=%F owner=%U group=%G mode=%a path=%n' "$path" 2>/dev/null || true
                find "$path" -maxdepth 2 -mindepth 1 -printf '%y %u:%g %m %p -> %l\n' 2>/dev/null | head -n 160 || true
              else
                printf 'missing=%s\n' "$path"
              fi
            done

            printf '\n== deploy-related timers/services ==\n'
            systemctl list-timers --all --no-pager 2>/dev/null | grep -Ei 'deploy|lightworld|variety|release' || true
            systemctl list-unit-files --no-pager 2>/dev/null | grep -Ei 'deploy|lightworld|variety|release' || true

            printf '\n== readable deployment unit definitions ==\n'
            grep -RilE 'deployments|last_manifest|lightworld-deploy|varietygroceries' \
              /etc/systemd/system /usr/lib/systemd/system /etc/cron.d /etc/cron.hourly /etc/cron.daily \
              2>/dev/null | head -n 80 || true

            printf '\n== runner sudo policy ==\n'
            sudo -n -l 2>&1 || true

            printf '\n== current variety release entries ==\n'
            find /home/lightworld/releases -maxdepth 1 -mindepth 1 -name 'varietygroceries*' -printf '%y %u:%g %m %p -> %l\n' 2>/dev/null | sort | tail -n 40 || true
          } > "$output_file" 2>&1

          python3 - "$output_file" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          text = re.sub(r'(?i)(token|password|secret|api[_-]?key)=\S+', r'\1=[REDACTED]', text)
          text = text.replace('```', "'''")
          if len(text) > 16000:
              text = text[:16000] + '\n[output truncated]\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Post sanitized result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            const output = fs.readFileSync(`${process.env.RUNNER_TEMP}/variety-bootstrap-output.txt`, 'utf8').trimEnd();
            const body = [
              '<!-- variety-vps-bootstrap-diagnostic -->',
              '**Variety VPS bootstrap diagnostic**',
              '',
              '```text',
              output || '(no output)',
              '```',
            ].join('\n');
            const url = `${process.env.GH_API_URL}/repos/${process.env.GH_REPOSITORY}/issues/${process.env.GH_ISSUE_NUMBER}/comments`;
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ body }),
            });
            if (!response.ok) throw new Error(`GitHub comment API returned ${response.status}`);
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
