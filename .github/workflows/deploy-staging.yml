name: Deploy TradeOS Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradeos-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, lightworld-vps, staging, tradeos-staging]
    timeout-minutes: 30
    steps:
      - name: Checkout canonical commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy exact main commit
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/lightworld-deploy-tradeos-staging "$GITHUB_SHA" "$GITHUB_WORKSPACE"
