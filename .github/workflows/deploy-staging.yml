name: Deploy TradeOS Staging

on:
  workflow_dispatch:
  "push":
    branches: [main]
    paths:
      - '.github/deploy-staging-request'

permissions:
  contents: read

concurrency:
  group: tradeos-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, lightworld-vps, staging, tradeos-staging]
    timeout-minutes: 30
    steps:
      - name: Checkout canonical commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy exact main commit
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/lightworld-deploy-tradeos-staging "$GITHUB_SHA" "$GITHUB_WORKSPACE"

      - name: Verify staging refund API access controls
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:4036
          for endpoint in /v1/refunds/branch-summary /v1/refunds/settlement-queue; do
            # These private read endpoints must not expose financial data to anonymous requests.
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base$endpoint")"
            if [ "$status" != "401" ]; then
              echo "Unsafe or unavailable refund endpoint: $endpoint returned HTTP $status (expected 401)" >&2
              exit 1
            fi
            echo "Authenticated boundary verified for $endpoint"
          done
