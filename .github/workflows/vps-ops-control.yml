name: VPS Ops Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: tradeos-staging-vps-ops
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.number == 67 &&
      github.actor == 'christianagbotah' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/vps ')
    runs-on: [self-hosted, linux, x64, lightworld-vps, staging, tradeos-staging]
    timeout-minutes: 5
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      GH_ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_API_URL: ${{ github.api_url }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Run allow-listed read-only operation
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/vps-ops-output.txt"
          : > "$output_file"

          case "$COMMENT_BODY" in
            "/vps status")
              sudo -n /usr/local/sbin/lightworld-status-tradeos-staging > "$output_file" 2>&1
              ;;
            "/vps health")
              {
                printf 'local_api_4036='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:4036/health
                printf 'local_web_3036='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 10 http://127.0.0.1:3036/
                printf 'public_root='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 15 https://tradeosafrica.lightworldtech.com/
                printf 'public_health='; curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' --max-time 15 https://tradeosafrica.lightworldtech.com/health
              } > "$output_file" 2>&1
              ;;
            "/vps disk")
              {
                df -h /
                free -h
              } > "$output_file" 2>&1
              ;;
            "/vps runner-status")
              {
                printf 'runner_user='; whoami
                printf 'host='; hostname
                uptime
                systemctl --no-pager --plain --type=service --state=running 'actions.runner.*tradeos*' 2>/dev/null || true
              } > "$output_file" 2>&1
              ;;
            "/vps variety-preflight")
              {
                printf 'runner_user='; whoami
                printf 'host='; hostname
                printf '\n== variety services ==\n'
                systemctl --no-pager --plain --all --type=service 2>/dev/null | grep -Ei 'variety|grocer' || true
                printf '\n== known paths ==\n'
                for path in \
                  /home/lightworld/webapps/varietygroceries \
                  /home/lightworld/webapps/varietygroceries-api \
                  /home/lightworld/config/varietygroceries \
                  /home/lightworld/data/varietygroceries; do
                  if [ -e "$path" ] || [ -L "$path" ]; then
                    stat -c 'type=%F owner=%U group=%G mode=%a path=%n' "$path" 2>/dev/null || true
                    if [ -L "$path" ]; then printf 'target='; readlink -f "$path" 2>/dev/null || true; fi
                  else
                    printf 'missing=%s\n' "$path"
                  fi
                done
                printf '\n== variety releases ==\n'
                find /home/lightworld/releases -maxdepth 1 -mindepth 1 -name 'varietygroceries*' -printf '%u:%g %m %p\n' 2>/dev/null | sort | tail -n 25 || true
                printf '\n== listeners ==\n'
                ss -ltn 2>/dev/null | grep -E ':(30[0-9][0-9]|40[0-9][0-9]|50[0-9][0-9])\b' || true
                printf '\n== variety processes ==\n'
                ps -eo user=,pid=,ppid=,args= | grep -Ei 'variety|grocer' | grep -v grep || true
                printf '\n== nginx config filenames ==\n'
                grep -Ril --include='*.conf' --include='*.vhost' 'portal\.varietygroceries\.com\|varietygroceries\.com' /etc/nginx /usr/local/apps/nginx/etc 2>/dev/null | head -n 30 || true
                printf '\n== available lightworld helpers ==\n'
                ls -l /usr/local/sbin/lightworld-* 2>/dev/null || true
                printf '\n== sudo allow-list ==\n'
                sudo -n -l 2>&1 || true
              } > "$output_file" 2>&1
              ;;
            "/vps variety-topology")
              {
                printf 'runner_user='; whoami
                id
                printf 'host='; hostname
                printf '\n== portal service properties ==\n'
                systemctl show varietygroceries-portal.service \
                  -p FragmentPath -p User -p Group -p WorkingDirectory -p ExecStart -p MainPID \
                  --no-pager 2>/dev/null || true
                printf '\n== portal service unit ==\n'
                systemctl cat varietygroceries-portal.service --no-pager 2>/dev/null || true
                printf '\n== portal process ==\n'
                pid="$(systemctl show varietygroceries-portal.service -p MainPID --value 2>/dev/null || true)"
                if [ -n "$pid" ] && [ "$pid" != "0" ]; then
                  ps -o user=,group=,pid=,ppid=,lstart=,args= -p "$pid" 2>/dev/null || true
                  printf 'cwd='; readlink -f "/proc/$pid/cwd" 2>/dev/null || true
                fi
                printf '\n== path ownership and runner write access ==\n'
                for path in \
                  /home/lightworld \
                  /home/lightworld/releases \
                  /home/lightworld/webapps \
                  /home/lightworld/webapps/varietygroceries \
                  /etc/systemd/system \
                  /usr/local/apps/nginx/etc/conf.d; do
                  stat -c 'owner=%U group=%G mode=%a path=%n' "$path" 2>/dev/null || true
                  if [ -w "$path" ]; then printf 'runner_writable=yes path=%s\n' "$path"; else printf 'runner_writable=no path=%s\n' "$path"; fi
                done
                printf '\n== variety webapp entries ==\n'
                find /home/lightworld/webapps -maxdepth 1 -mindepth 1 -iname '*variety*' -printf '%y %u:%g %m %p -> %l\n' 2>/dev/null || true
                printf '\n== portal nginx routing ==\n'
                for conf in \
                  /usr/local/apps/nginx/etc/conf.d/zzz-varietygroceries-portal.conf \
                  /usr/local/apps/nginx/etc/conf.d/webuzoVH.conf; do
                  if [ -r "$conf" ]; then
                    printf '%s\n' "--- $conf ---"
                    grep -nE 'server_name|listen|proxy_pass|root |alias |location |include |upstream|varietygroceries' "$conf" 2>/dev/null | head -n 160 || true
                  fi
                done
                printf '\n== current portal release metadata ==\n'
                workdir="$(systemctl show varietygroceries-portal.service -p WorkingDirectory --value 2>/dev/null || true)"
                if [ -n "$workdir" ] && [ -d "$workdir" ]; then
                  stat -c 'owner=%U group=%G mode=%a path=%n' "$workdir" 2>/dev/null || true
                  find "$workdir" -maxdepth 1 -mindepth 1 -printf '%y %u:%g %m %f -> %l\n' 2>/dev/null | sort | head -n 100 || true
                  printf '\n== environment filenames/names only ==\n'
                  find "$workdir" -maxdepth 2 -type f -name '.env*' -print 2>/dev/null || true
                fi
              } > "$output_file" 2>&1
              ;;
            *)
              printf 'Rejected: command is not in the read-only allow-list.\n' > "$output_file"
              exit 64
              ;;
          esac

          python3 - "$output_file" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          text = re.sub(
              r'(?i)(token|password|secret|api[_-]?key)=\S+',
              r'\1=[REDACTED]',
              text,
          )
          text = text.replace('```', "'''")
          if len(text) > 12000:
              text = text[:12000] + '\n[output truncated]\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Post sanitized result to control issue
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          async function postResult() {
            const path = `${process.env.RUNNER_TEMP}/vps-ops-output.txt`;
            const output = fs.readFileSync(path, 'utf8').trimEnd();
            const body = [
              '<!-- lightworld-vps-ops -->',
              `**VPS Ops result** for \`${process.env.COMMENT_BODY}\``,
              '',
              '```text',
              output || '(no output)',
              '```',
            ].join('\n');
            const url = `${process.env.GH_API_URL}/repos/${process.env.GH_REPOSITORY}/issues/${process.env.GH_ISSUE_NUMBER}/comments`;
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ body }),
            });
            if (!response.ok) {
              throw new Error(`GitHub comment API returned ${response.status}`);
            }
          }

          postResult().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE
